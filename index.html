<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bluewind English">
<meta name="application-name" content="Bluewind English">
<meta name="theme-color" content="#2a62b0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Bluewind English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: bright learning-path app — white ground, chunky 3D buttons, one color per unit (Aeroporto azul, Hotel roxo, Fábrica laranja, Dia a dia verde-menta) */
:root{
  --bg:#ffffff; --bg2:#f6f8fc; --line:#e4e8f1; --ink:#2b3150; --muted:#8a91ab;
  --good:#3cc96a; --good-d:#29a352; --good-bg:#dcf8e5;
  --bad:#ff5a5f; --bad-d:#d93f44; --bad-bg:#ffe3e4;
  --blue:#2fb4ff; --blue-d:#1a8fd0; --gold:#ffc93c; --gold-d:#e0a400; --gold-ink:#5a3d00;
  --navy:#16285a; --pink:#ff7eb3;
  --tP:#ff8a3d; --tC:#2fb4ff; --tQ:#a874ff; --tB:#20c98a;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
[hidden]{display:none!important}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:900}

/* botões 3D */
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-weight:900;font-size:17px;letter-spacing:.6px;text-transform:uppercase;
  background:var(--c,var(--good));color:#fff;box-shadow:0 4px 0 var(--cd,var(--good-d));transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--cd,var(--good-d))}
.btn:disabled{background:var(--line);color:#b3b9cc;box-shadow:0 4px 0 #d3d8e5;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.blue{--c:var(--blue);--cd:var(--blue-d)} .btn.red{--c:var(--bad);--cd:var(--bad-d)} .btn.gold{--c:var(--gold);--cd:var(--gold-d);color:var(--gold-ink)}

/* app shell */
.app{position:relative;z-index:0;isolation:isolate;max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:2px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.flag{font-family:var(--display);font-size:15px;color:#fff;background:var(--navy);padding:4px 9px;border-radius:10px;letter-spacing:.5px}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.stat svg{width:24px;height:24px}
.st-streak{color:var(--tP)} .st-gem{color:var(--blue)} .st-heart{color:var(--bad)}
.stat.off{color:#c3c8d6}
.tab{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center;
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{display:flex;gap:6px;width:100%;max-width:560px;justify-content:space-around}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:14px;border:2px solid transparent;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;flex:1}
.nav button svg{width:28px;height:28px}
.nav button[aria-current="true"]{background:#e8f6ff;border-color:#a6dcff;color:var(--blue-d)}

/* trilha */
.unit{display:flex;flex-direction:column;align-items:center;gap:0}
.ubanner{width:100%;border-radius:18px;padding:16px 16px 18px;background:var(--uc);color:#fff;box-shadow:0 5px 0 var(--ud);display:flex;align-items:center;gap:12px;margin-bottom:60px}
.ubanner.locked{background:#d9dee9;box-shadow:0 5px 0 #c3c9d8}
.ubanner .ut{flex:1;min-width:0}
.ubanner small{display:block;font-size:13px;font-weight:900;opacity:.85;text-transform:uppercase;letter-spacing:1px}
.ubanner b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05}
.ubanner span{display:block;font-size:14px;font-weight:800;opacity:.95}
.ubanner .ucount{font-family:var(--display);font-size:20px;background:rgba(255,255,255,.22);border-radius:12px;padding:6px 10px;white-space:nowrap}
.nodes{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;padding-bottom:30px}
.nodewrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:76px;height:70px;border-radius:50%;background:var(--uc);box-shadow:0 7px 0 var(--ud);display:grid;place-items:center;color:#fff;transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ud)}
.node svg{width:36px;height:36px}
.node.locked{background:#e3e7f0;box-shadow:0 7px 0 #c9cfdd;color:#aeb5c8}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d);color:#fff}
.node.chest,.node.trophy{background:transparent;box-shadow:none;width:84px;height:76px}
.node.chest svg,.node.trophy svg{width:64px;height:64px}
.nodewrap.current .node:not(.chest):not(.trophy){outline:7px solid color-mix(in srgb,var(--uc) 28%,transparent);outline-offset:4px}
.start-tag{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:#fff;color:var(--uc);border:2px solid var(--line);font-weight:900;font-size:14px;padding:7px 12px;border-radius:12px;white-space:nowrap;letter-spacing:.8px;animation:float 1.4s ease-in-out infinite}
.start-tag::after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff}
@keyframes float{50%{transform:translate(-50%,-5px)}}
.pathcat{position:absolute;width:96px;height:96px}
.popover{position:absolute;top:calc(100% + 14px);left:calc(50% - var(--o,0px));transform:translateX(-50%);z-index:5;width:250px;background:var(--uc);color:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(30,40,80,.25)}
.popover.locked{background:#f1f3f8;color:var(--muted);border:2px solid var(--line)}
.popover::before{content:"";position:absolute;bottom:100%;left:calc(50% + var(--o,0px));margin-left:-9px;border:9px solid transparent;border-bottom-color:var(--uc)}
.popover.locked::before{border-bottom-color:#f1f3f8}
.popover b{font-size:18px;font-weight:900}
.popover span{font-size:14px;font-weight:800;opacity:.92}
.popover .btn{background:#fff;color:var(--uc);box-shadow:0 4px 0 rgba(0,0,0,.18);padding:12px}

/* lição */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.lhead{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:620px;width:100%;margin:0 auto}
.xbtn{width:36px;height:36px;display:grid;place-items:center;color:#b3b9cc;font-size:30px;font-weight:900;line-height:1}
.prog{flex:1;height:16px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:var(--good);position:relative;transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.lhearts{display:flex;align-items:center;gap:4px;color:var(--bad);font-weight:900;font-size:18px}
.lhearts svg{width:26px;height:26px}
.mq{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#b3b9cc;border:2px solid var(--line)}
.mq.on{background:var(--pink);border-color:var(--pink);color:#fff}
.lbody{flex:1;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 200px max(16px,env(safe-area-inset-left,0px));max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ltitle{font-family:var(--body);font-weight:900;font-size:24px;margin:0;line-height:1.2;text-wrap:balance}
.newtag{display:inline-flex;align-items:center;gap:6px;color:var(--tQ);font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.streakmsg{color:var(--tP);font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:1px}
.sayrow{display:flex;align-items:flex-end;gap:10px}
.sayrow .cat{width:96px;height:96px}
.say{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:18px;font-weight:800;line-height:1.35;margin-bottom:22px;background:#fff}
.say::before{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.sentence{font-size:22px;font-weight:800;line-height:1.5}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--line);text-align:center;color:var(--blue-d);padding:0 4px}
.lines{min-height:112px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 54px,var(--line) 54px 56px);padding:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{background:#fff;border:2px solid var(--line);border-bottom-width:4px;padding:9px 13px;border-radius:14px;font-size:18px;font-weight:800;color:var(--ink)}
.tile:active{transform:translateY(2px)}
.tile.ghost{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
.opts{display:grid;gap:12px}
.opt{text-align:center;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:16px;font-size:19px;font-weight:800}
.opt.wide{text-align:left;font-size:17px}
.opt[aria-pressed="true"]{background:#e8f6ff;border-color:#84cfff;color:var(--blue-d)}
.opt.okk{background:var(--good-bg);border-color:var(--good);color:var(--good-d)}
.opt.nok{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-d)}
.listen{display:flex;gap:14px;align-items:center;justify-content:center;padding:6px 0}
.bigspk{width:104px;height:104px;border-radius:24px;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);color:#fff;display:grid;place-items:center}
.bigspk svg{width:52px;height:52px}
.slow{width:68px;height:68px;border-radius:18px;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);color:#fff;font-weight:900;font-size:12px;display:grid;place-items:center;text-transform:uppercase}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:12px}
.mbtn{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 8px;font-size:17px;font-weight:800;min-height:58px}
.mbtn[aria-pressed="true"]{background:#e8f6ff;border-color:#84cfff;color:var(--blue-d)}
.mbtn.okk{background:var(--good-bg);border-color:var(--good);color:var(--good-d)}
.mbtn.nok{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-d);animation:shake .35s}
.mbtn.gone{opacity:.35;pointer-events:none;background:var(--bg2);color:var(--muted)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.lfoot{position:fixed;left:0;right:0;bottom:0;z-index:21;border-top:2px solid var(--line);background:#fff;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:78vh;overflow-y:auto}
.lfoot.good{background:var(--good-bg);border-top-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-top-color:transparent}
.lfoot-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.fbh{display:flex;align-items:center;gap:10px}
.fbh .badge{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.fbh .badge svg{width:26px;height:26px}
.fbh h3{margin:0;font-size:24px;font-weight:900;flex:1}
.lfoot.good h3{color:var(--good-d)} .lfoot.bad h3{color:var(--bad-d)}
.fbx{font-size:15px;font-weight:800;line-height:1.4}
.lfoot.good .fbx{color:var(--good-d)} .lfoot.bad .fbx{color:var(--bad-d)}
.full{display:flex;gap:10px;align-items:flex-start;font-size:18px;font-weight:800;color:var(--ink)}
.full span{flex:1;min-width:0}
.spk{flex:none;width:40px;height:40px;border-radius:12px;background:var(--blue);box-shadow:0 3px 0 var(--blue-d);color:#fff;display:grid;place-items:center}
.spk svg{width:22px;height:22px}
.pt{font-size:15px;color:var(--muted);font-weight:800}
.why{background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;line-height:1.45;color:var(--ink)}
.why .lbl{display:block;margin-bottom:3px;color:var(--blue-d)}
.whyx{background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;line-height:1.45;border-left:5px solid var(--bad);color:var(--ink)}
.whyx .lbl{display:block;margin-bottom:3px;color:var(--bad-d)}
.mine{font-size:15px;font-weight:800;color:var(--muted)}
.mine s{color:var(--bad-d);text-decoration-thickness:2px}
.xpg{font-family:var(--display);color:var(--gold-d);font-size:20px}

/* fim de lição */
.done{align-items:center;justify-content:center;text-align:center;overflow-y:auto}
.done-in{max-width:460px;width:100%;margin:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:18px}
.done .bigcat{width:170px;height:170px}
.done h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0;color:var(--gold-d);line-height:1.05}
.done p{margin:0;color:var(--muted);font-weight:800}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.t3{border-radius:16px;border:2px solid var(--c);overflow:hidden;background:var(--c)}
.t3 small{display:block;color:#fff;font-weight:900;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:5px 2px}
.t3 b{display:flex;align-items:center;justify-content:center;gap:4px;background:#fff;color:var(--c);border-radius:13px;padding:12px 2px;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.t3 b svg{width:20px;height:20px}
.mist{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.mist .row{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:800}
.mist .row span{flex:1;min-width:0}
.mist .row small{display:block;color:var(--muted);font-weight:700}
.flame{width:150px;height:150px;animation:flick 1s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.06) rotate(-2deg)}}
.bigstreak{font-family:var(--display);font-size:90px;color:var(--tP);line-height:.9}
.week{display:flex;gap:8px}
.week i{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900;color:var(--muted)}
.week i.on{background:var(--tP);color:#fff}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,28,60,.5);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mcard{width:100%;max-width:460px;background:#fff;border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;animation:up .25s ease-out}
.mcard h3{margin:0;font-size:24px;font-weight:900}
.mcard p{margin:0;color:var(--muted);font-weight:800}
.mcard .cat{width:110px;height:110px}
.chestbig{width:140px;height:140px;animation:wob .5s ease-in-out 3}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* perfil, caderneta, rádio */
.card{border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;gap:14px}
.ph .cat{width:100px;height:100px}
.ph h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1}
.ph p{margin:4px 0 0;color:var(--muted);font-weight:800}
.xpbar{height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbox{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}
.sbox svg{width:30px;height:30px;flex:none}
.sbox b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.sbox span{font-size:13px;color:var(--muted);font-weight:800}
.goal{display:flex;align-items:center;gap:16px}
.goal svg{width:84px;height:84px;flex:none}
.goal b{font-size:18px;font-weight:900;display:block}
.goal span{color:var(--muted);font-weight:800;font-size:14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:900}
.toggle{width:54px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:left .2s}
.toggle[aria-pressed="true"]{background:var(--good)}
.toggle[aria-pressed="true"]::after{left:26px}
.wlist{display:flex;flex-direction:column;gap:8px}
.wrowbtn{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 12px;text-align:left}
.wrowbtn b{font-size:18px;font-weight:900;min-width:0}
.wrowbtn span{flex:1;min-width:0;color:var(--muted);font-weight:800;font-size:14px}
.boxes{display:flex;gap:3px;flex:none}
.boxes i{width:10px;height:6px;border-radius:3px;background:var(--line)}
.boxes i.on{background:var(--good)}
.empty{color:var(--muted);font-weight:800;text-align:center;padding:12px}
.h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.scenes{display:flex;gap:8px;flex-wrap:wrap}
.scene{padding:9px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;font-weight:900;font-size:15px}
.scene[aria-pressed="true"]{background:#ffe9f3;border-color:var(--pink);color:#d4407e}
.rnow{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:800;font-size:14px;min-height:20px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--pink);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.45s}

.lchip{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:900;font-size:15px}
.lchip b{font-family:var(--display);font-weight:400;font-size:12px;background:var(--navy);color:#fff;padding:2px 6px;border-radius:7px}
.lchip[aria-pressed="true"]{background:#fff;color:var(--blue-d);border-color:#fff;box-shadow:0 4px 0 rgba(0,40,100,.25)}
.mcard .langpick{margin:6px auto 4px}
.mcard .llbl{color:#6b7390}
.mcard .lchip{background:#f3f6fb;border-color:var(--line);color:#2b3150}
.mcard .lchip[aria-pressed="true"]{background:#e8f6ff;border-color:#84cfff;color:var(--blue-d);box-shadow:none}
.coursebox{display:flex;align-items:center;justify-content:space-between;gap:10px}
.coursebox span{font-weight:900}
.coursebox .btn{width:auto;padding:10px 14px;font-size:14px;flex:none}
.nask{display:grid;gap:4px;text-align:center;color:#fff}
.nask b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15;text-shadow:0 3px 0 rgba(0,40,100,.3)}
.nbtns{display:grid;gap:10px;width:100%;margin-top:6px}
.lchip.lnat{justify-content:center;font-size:20px;padding:14px;background:#fff;color:var(--blue-d);border-color:#fff;box-shadow:0 5px 0 rgba(0,40,100,.3)}
.lchip.lnat b{font-size:15px}
.mcardpath{display:grid;grid-template-columns:76px 1fr;gap:10px 12px;align-items:center;margin:4px 0 22px;padding:14px;border-radius:20px;background:linear-gradient(135deg,#1c4686,#2a62b0);color:#fff;box-shadow:0 5px 0 #143466}
.mcp-av{width:76px;height:76px;border-radius:50%;overflow:hidden;border:3px solid #d4f531}
.mcp-av svg,.cav svg{width:100%;height:100%;display:block}
.mcp-txt{display:grid;gap:2px}.mcp-txt small{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#d4f531;display:flex;align-items:center;gap:4px}
.mcp-txt small svg{width:14px;height:14px}.mcp-txt b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}.mcp-txt span{font-size:13px;font-weight:700;opacity:.9;line-height:1.3}
.mcardpath .btn{grid-column:1/-1}
#mchat{display:flex;flex-direction:column;gap:10px}
.cmsg{display:flex;gap:8px;align-items:flex-end;max-width:92%;animation:mpop .3s ease-out}
@keyframes mpop{from{opacity:0;transform:translateY(8px)}}
.cmsg.me{flex-direction:row-reverse;align-self:flex-end}
.cav{flex:none;width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--line)}
.cbub{position:relative;background:#eef4ff;border:2px solid #cfe0ff;border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:17px;font-weight:800;line-height:1.3;color:var(--ink);display:grid;gap:2px}
.cmsg.me .cbub{background:var(--good-bg);border-color:#b5ebc6;border-radius:16px 16px 4px 16px}
.cbub small{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.cbub em{font-style:normal;font-size:13px;font-weight:700;color:var(--muted)}
.cbub .cspk{position:absolute;right:-12px;top:-12px;width:32px;height:32px;border-radius:10px}
.cbub .cspk svg{width:18px;height:18px}
.cmsg.sup .cbub{padding-right:26px}
.mturbi .say{margin-bottom:0;font-size:16px}
#mtask{display:flex;flex-direction:column;gap:14px;border-top:2px dashed var(--line);padding-top:14px}
#mtask:empty{display:none}
.mlisten .slow{width:auto;height:auto;padding:10px 14px;display:flex;gap:6px;align-items:center}
.mlisten .slow svg{width:18px;height:18px}
.mopt{display:flex;align-items:center;gap:10px;text-align:left;font-size:17px}
.spk.mini{width:30px;height:30px;border-radius:9px}.spk.mini svg{width:16px;height:16px}
.micbtn{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px auto 0;width:150px;padding:18px 10px;border-radius:24px;background:var(--bad,#ff5a5f);color:#fff;font-weight:900;font-size:14px;text-transform:uppercase;box-shadow:0 5px 0 var(--bad-d,#d63c41)}
.micbtn svg{width:44px;height:44px}
.micbtn.on{animation:micp 1s ease-in-out infinite;background:var(--good);box-shadow:0 5px 0 var(--good-d)}
@keyframes micp{50%{transform:scale(1.06)}}
.mchunk{background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;line-height:1.4;border-left:5px solid var(--gold);color:var(--ink);display:grid;gap:2px}
.mchunk small{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--gold-d);display:flex;gap:4px;align-items:center}
.mchunk small svg{width:14px;height:14px}
.mweek{background:#fff8e1}.mweek b{font-size:18px}.mweek span{font-size:13px;color:var(--muted)}
.mend{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.mend h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--good-d)}
.mend .tiles3{grid-template-columns:repeat(2,1fr)}
.node.mnode{width:96px;height:78px;border-radius:26px}
.node.mnode svg{width:42px;height:42px}
.pwrap{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#eef6ff}
.pscene{display:block;width:100%;height:auto}
b.prep{color:#0891b2;background:#cff7fe;border-radius:6px;padding:0 3px;font-weight:900}
.prept{border-left-color:#06b6d4}
.tipm.prept{margin-top:8px}
.intro.tg{background:linear-gradient(180deg,#2b5aa8 0%,#5d6fb6 28%,#e07a45 62%,#f4b26a 82%)}
.intro.tg .hills path:nth-child(1){fill:#d8a24a}.intro.tg .hills path:nth-child(2){fill:#b9772f}
.tgdecor{position:absolute;left:0;right:0;bottom:34%;width:100%;height:17%;pointer-events:none}
.hpop{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(20,30,60,.55);animation:fade .3s both}
.hpop[hidden]{display:none}
.hpop-in{width:min(100%,420px);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:pop .35s ease-out both}
.hpop-in img{display:block;width:100%;height:auto}
.hpop-in .btn{margin:14px;width:calc(100% - 28px)}
/* missão: fundo de fábrica, Turbi menor, espaço para as pecinhas */

#lesson .lhead,#lesson .lbody,#cards .lhead,#cards .lbody{position:relative;z-index:1}
.mbg::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.62)}
.mbg.soft::after{background:rgba(255,255,255,.74)}
.mbg svg{filter:saturate(.6)}
.mbg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.mbg svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:max(100%,560px);height:100%}
#mission .lhead,#mission .lbody{position:relative;z-index:1}
#mbody{padding-bottom:calc(240px + env(safe-area-inset-bottom,0px))}
#mtask{background:rgba(255,255,255,.92);border:2px solid #fff;border-radius:22px;padding:14px;box-shadow:0 6px 20px rgba(20,40,80,.12)}
#mtask .sayrow .cat{width:72px;height:84px}
#mtask .mturbi .say{font-size:15px}
.cmsg .cbub{box-shadow:0 3px 10px rgba(20,40,80,.1)}

const DICT={};
const formsOf=t=>String(t).split('/').map(p=>p.replace(/\(.*?\)/g,'').trim().toLowerCase()).filter(Boolean);
const clean=w=>String(w).toLowerCase().replace(/[¿¡?.!,]/g,'');

let LOOK={};
function buildLook(){
  LOOK={}; const t=TL();
  for(const [k,d] of Object.entries(DICT)){
    if(d.only&&d.only!==t) continue;
    const fs=t==='en'?[k]:formsOf(d[t]);
    fs.forEach(f=>{ if(!(f in LOOK)||(d.u>=0&&DICT[LOOK[f]].u<0)) LOOK[f]=k; });
  }
  buildBLook();
}
/* índice no idioma de quem estuda: deixa tocar nas palavras da frase da pergunta para ver a tradução */
let BLOOK={};
const HINT_LV=10; // até este nível as palavras da pergunta mostram a tradução
function buildBLook(){
  BLOOK={}; const b=BL();
  for(const [k,d] of Object.entries(DICT)){
    if(d.only&&d.only!==b) continue;
    const fs=b==='en'?[k]:formsOf(d[b]);
    fs.forEach(f=>{ if(!(f in BLOOK)||(d.u>=0&&DICT[BLOOK[f]].u<0)) BLOOK[f]=k; });
  }
}
function lookupB(raw){
  const w=clean(raw); if(w in BLOOK) return BLOOK[w];
  if(w.endsWith('es')&&(w.slice(0,-2) in BLOOK)) return BLOOK[w.slice(0,-2)];
  if(w.endsWith('s')&&(w.slice(0,-1) in BLOOK)) return BLOOK[w.slice(0,-1)];
  return null;
}
const promptHelp=()=>levelInfo(S.xp).l<HINT_LV;
function wrapPrompt(text){
  if(!promptHelp()) return text;
  const tk=text.split(' '), out=[];
  for(let i=0;i<tk.length;){
    let done=false;
    for(const n of [4,3,2]){
      if(i+n>tk.length) continue;
      const key=lookupB(tk.slice(i,i+n).join(' '));
      if(key){ out.push(`<span class="pw" data-p="${key}">${tk.slice(i,i+n).join(' ')}</span>`); i+=n; done=true; break; }
    }
    if(done) continue;
    const key=lookupB(tk[i]);
    out.push(key?`<span class="pw" data-p="${key}">${tk[i]}</span>`:tk[i]); i++;
  }
  return out.join(' ');
}
function lookup(raw){
  const w=clean(raw); if(w in LOOK) return LOOK[w];
  if(w.endsWith('es')&&(w.slice(0,-2) in LOOK)) return LOOK[w.slice(0,-2)];
  if(w.endsWith('s')&&(w.slice(0,-1) in LOOK)) return LOOK[w.slice(0,-1)];
  return null;
}

/* deixa cada palavra tocável; junta expressões de até 4 palavras quando existirem */
function wrapWords(text){
  const tk=text.split(' '), out=[];
  for(let i=0;i<tk.length;){
    let done=false;
    for(const n of [4,3,2]){
      if(i+n>tk.length) continue;
      const key=lookup(tk.slice(i,i+n).join(' '));
      if(key){ out.push(`<span class="w" data-w="${key}">${tk.slice(i,i+n).join(' ')}</span>`); i+=n; done=true; break; }
    }
    if(done) continue;
    const key=lookup(tk[i]);
    out.push(key?`<span class="w" data-w="${key}">${tk[i]}</span>`:tk[i]); i++;
  }
  return out.join(' ');
}

let ac=null,master=null,comp=null;
function A(force){
  if(typeof RENDERING!=='undefined'&&RENDERING) return ac;
  if(!S.sound && !force) return null;
  try{
    if(!ac){
      try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
      ac=new (window.AudioContext||window.webkitAudioContext)();
      comp=ac.createDynamicsCompressor(); comp.connect(ac.destination);
      master=ac.createGain(); master.gain.value=.9; master.connect(comp);
      const dl=ac.createDelay(); dl.delayTime.value=.16; const fb=ac.createGain(); fb.gain.value=.25; const wet=ac.createGain(); wet.gain.value=.2;
      master.connect(dl); dl.connect(fb).connect(dl); dl.connect(wet).connect(comp);
    }
    if(ac.state!=='running'){ try{ ac.resume(); }catch(e){} }
    return ac;
  }catch(e){ return null; }
}
function env(g,t,a,peak,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
function bell(f,dt=0,vol=.16){ try{ bell_(f,dt,vol); }catch(e){} }
function bell_(f,dt=0,vol=.16){ const c=A(); if(!c) return; const t=c.currentTime+dt;
  [[1,1],[2.01,.35],[3.98,.12]].forEach(([m,v])=>{ const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=f*m; env(g,t,.005,vol*v,.7); o.connect(g).connect(master); o.start(t); o.stop(t+.8); }); }
function blip(f1,f2,dur,type='sine',vol=.15,dt=0){ try{ blip_(f1,f2,dur,type,vol,dt); }catch(e){} }
function blip_(f1,f2,dur,type='sine',vol=.15,dt=0){ const c=A(); if(!c) return; const t=c.currentTime+dt;
  const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  env(g,t,.008,vol,dur); o.connect(g).connect(master); o.start(t); o.stop(t+dur+.05); }
function meow(happy=true,dt=0){ const c=A(); if(!c) return; const t=c.currentTime+dt, d=happy?.5:.8;
  const o=c.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(happy?540:440,t); o.frequency.linearRampToValueAtTime(happy?860:560,t+d*.35); o.frequency.linearRampToValueAtTime(happy?620:290,t+d);
  const lfo=c.createOscillator(),lg=c.createGain(); lfo.frequency.value=7; lg.gain.value=happy?8:16; lfo.connect(lg).connect(o.frequency);
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=4;
  bp.frequency.setValueAtTime(700,t); bp.frequency.linearRampToValueAtTime(1800,t+d*.35); bp.frequency.linearRampToValueAtTime(850,t+d);
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.4,t+.06); g.gain.setValueAtTime(.32,t+d*.6); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(bp).connect(g).connect(master); o.start(t); o.stop(t+d+.05); lfo.start(t); lfo.stop(t+d+.05); }

const midi=n=>440*Math.pow(2,(n-69)/12);
function note(f,t,d,type,vol,cut){ if(!(vol>0)) return; const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();
  o.type=type; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=cut||3600;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(d,.06));
  o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t+d+.08); }
function drum(k,t){

  const src=ac.createBufferSource(); src.buffer=noiseBuf(ac); const f=ac.createBiquadFilter(), g=ac.createGain();
  const P={s:['bandpass',1900,.32,.14],h:['highpass',7500,.12,.04],c:['highpass',5000,.22,1.1],r:['highpass',3000,.1,.6]}[k];

  S.music.on=true; save(); renderRadio();
}
function musicOff(){
  MUS.on=false; clearInterval(MUS.timer);
  if(MUS.bus&&ac) MUS.bus.gain.setTargetAtTime(.0001,ac.currentTime,.2);
  try{ unlockEl && unlockEl.pause(); }catch(e){}
  S.music.on=false; save(); renderRadio();
}
function duck(){ if(!MUS.on||!MUS.bus) return; const t=ac.currentTime; MUS.bus.gain.cancelScheduledValues(t); MUS.bus.gain.setTargetAtTime(Math.max(S.music.vol*MUSIC_GAIN*.2,.001),t,.05); MUS.bus.gain.setTargetAtTime(Math.max(S.music.vol*MUSIC_GAIN,.001),t+2,.4); }
function renderRadio(){
  const on=MUS.on;
  if($('musBtn')){ $('musBtn').textContent=on?'Desligar':'Ligar'; $('musBtn').setAttribute('aria-pressed',on); }
  if($('musNow')) $('musNow').innerHTML=on?`<span class="eq"><i></i><i></i><i></i></span>${MUS.label}`:'Desligada · música instrumental feita na hora';
  if($('musStyles')) $('musStyles').innerHTML=Object.entries(STYLES).map(([k,v])=>`<button class="scene" aria-pressed="${S.music.style===k}" data-ms="${k}">${v.name}</button>`).join('');
  if($('musQuick')) $('musQuick').classList.toggle('on',on);
}

function meow(happy=true,dt=0){ if(!RENDERING && playSfx(happy?'meowH':'meowS',1,dt)) return; try{ meow_(happy,dt); }catch(e){} }
function meow_(happy=true,dt=0){
  const c=A(); if(!c) return; const t=c.currentTime+dt;
  try{
    const s=c.createBufferSource(); s.buffer=noiseBuf(c);
    const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.4;
    f.frequency.setValueAtTime(happy?350:1200,t); f.frequency.exponentialRampToValueAtTime(happy?2600:260,t+.55);
    const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.5,t+.16); g.gain.exponentialRampToValueAtTime(.0001,t+.65);
    s.connect(f).connect(g).connect(master); s.start(t,Math.random()*.3); s.stop(t+.7);
  }catch(e){}
  if(happy){ blip(700,1400,.16,'sine',.11,dt+.12); blip(1050,1900,.13,'sine',.09,dt+.3); }
  else blip(520,240,.4,'sine',.12,dt+.12);
}

  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.28,t+.08); g.gain.exponentialRampToValueAtTime(.0001,t+.4);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+.45); };

const canSpeak='speechSynthesis' in window;
let VOICE=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices(); const L0=TTSL[TL()], pre=L0.slice(0,2), nl=s=>String(s).replace('_','-'); VOICE=v.find(x=>nl(x.lang)===L0&&/Samantha|Google|Aria|Jenny|Ava|Luciana|Paulina|Francisca|Monica|Joana|Felipe/.test(x.name))||v.find(x=>nl(x.lang)===L0)||(pre==='es'&&v.find(x=>/^es[-_](MX|US|419)/.test(x.lang)))||(pre==='pt'&&v.find(x=>/^pt[-_]BR/.test(x.lang)))||v.find(x=>x.lang.startsWith(pre))||null; }catch(e){} }
if(canSpeak){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
/* a voz precisa começar no mesmo instante do toque (exigência do iPhone) */
/* guarda a fala atual (no iPhone ela some da memória e trava a próxima), e tenta de novo se não começar */
let SPK_U=null, SPK_T=null, SPK_N=0;
function speakRate(t,r,retry){ duck();
  try{ const ss=speechSynthesis, id=++SPK_N;
    if(ss.paused) ss.resume();
    if(!VOICE) pickVoice();
    const go=()=>{ if(id!==SPK_N) return;
      const u=new SpeechSynthesisUtterance(t); u.lang=VOICE?VOICE.lang:TTSL[TL()]; u.rate=r; u.volume=1; if(VOICE) u.voice=VOICE;
      let started=false; u.onstart=()=>{ started=true; }; u.onend=u.onerror=()=>{ if(SPK_U===u) SPK_U=null; };
      SPK_U=u; ss.speak(u); if(ss.paused) ss.resume();
      clearTimeout(SPK_T); SPK_T=setTimeout(()=>{ if(!started&&id===SPK_N&&!retry){ try{ ss.cancel(); }catch(e){} speakRate(t,r,true); } },1200); };
    if(ss.speaking||ss.pending){ ss.cancel(); setTimeout(go,90); } else go();
  }catch(e){} }
/* destrava a voz no primeiro toque do app */
function unlockSpeech(){ try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang=TTSL[TL()]; speechSynthesis.speak(u); }catch(e){} }
const speak=t=>speakRate(t,.88);
/* botão Devagar: fala palavra por palavra, com pausa entre elas e voz mais lenta */
function speakSlow(t,retry){ duck();
  try{ const ss=speechSynthesis, id=++SPK_N; clearTimeout(SPK_T);
    if(ss.speaking||ss.pending) ss.cancel(); if(ss.paused) ss.resume(); if(!VOICE) pickVoice();
    const words=String(t).split(/\s+/).filter(Boolean), parts=words.length>1?words:[t];
    setTimeout(()=>{ if(id!==SPK_N) return;
      SPK_U=parts.map(w=>{ const u=new SpeechSynthesisUtterance(w); u.lang=VOICE?VOICE.lang:TTSL[TL()]; u.rate=parts.length>1?.62:.42; u.volume=1; if(VOICE) u.voice=VOICE; return u; });
      let started=false; SPK_U[0].onstart=()=>{ started=true; };
      SPK_U.forEach(u=>ss.speak(u)); if(ss.paused) ss.resume();
      /* no iPhone a fila de falas às vezes trava: se não começar, tenta de novo uma vez */
      SPK_T=setTimeout(()=>{ if(!started&&id===SPK_N&&!retry){ try{ ss.cancel(); }catch(e){} speakSlow(t,true); } },1300); },90);
  }catch(e){} }

  for(const u of UNITS) for(const s of u.S) if(re.test(s[TL()])) return s;
  return null;
}
function memBlock(k){
  const ex=exampleFor(k);
  return `<div class="mem"><span class="lbl">${T('memLbl')}</span>${(hasMem()&&MEM[k])||T('memGeneric')}
    ${ex?`<div class="ex">"${ex[TL()]}"<small>${ex[BL()]}</small></div>`:''}</div>`;
}
function openWord(k){
  const d=DICT[k]; if(!d) return;

const BASE_UNITS=8;

function streakNow(){ const y=new Date(Date.now()-864e5).toDateString(); return (S.last===today()||S.last===y)?S.streak:0; }
function group(u,n){ const q=Math.ceil(u.W.length/4); return u.W.slice((n-1)*q,n*q); }

function refillHearts(){
  const now=Date.now();
  if(S.hearts<=0){
    if(!S.zeroAt) S.zeroAt=now;
    if(now-S.zeroAt>=ZERO_MIN*60000){ S.hearts=MAXH; S.zeroAt=null; S.heartAt=now; save(); }
    return;
  }
  S.zeroAt=null;
  if(S.hearts>=MAXH){ S.heartAt=now; return; }
  const n=Math.floor((now-S.heartAt)/(HEART_MIN*60000));
  if(n>0){ S.hearts=Math.min(MAXH,S.hearts+n); S.heartAt+=n*HEART_MIN*60000; if(S.hearts>=MAXH) S.heartAt=now; save(); }
}

let L=null;
function buildExercises(k,node){
  const u=UNITS[k];
  const focus=node.type==='trophy'?u.W.slice():group(u,node.n);
  const review=node.type==='trophy'?u.W.slice():u.W.slice(0,Math.ceil(u.W.length/4)*node.n);
  const wrongFirst=a=>shuffle(a).sort((x,y)=>(S.wrong.includes(y)?1:0)-(S.wrong.includes(x)?1:0));
  let fq=wrongFirst(focus), fi=0;
  const nextWord=()=>fq[fi++%fq.length];
  const others=(w,pool,n,f)=>{ const out=[], seen=new Set([f(w)]); for(const x of shuffle(pool.length>n+2?pool:u.W)) { if(x!==w&&!seen.has(f(x))){ seen.add(f(x)); out.push(x); if(out.length===n) break; } } return out; };
  const sq=wrongFirst(u.S.map(s=>s.en)).map(en=>u.S.find(s=>s.en===en));
  const fl=focus.map(w=>sayW(w.toLowerCase()));
  const sentFirst=sq.filter(s=>fl.some(w=>s[TL()].toLowerCase().includes(w))).concat(sq);
  let si=0; const nextSent=()=>sentFirst[si++%sentFirst.length];
  const tr=w=>trn(w.toLowerCase()), ds=w=>sayW(w.toLowerCase());
  let kinds=node.type==='trophy'?KTROPHY:KINDS;
  return kinds.map(kd=>{
    if(!canSpeak&&kd.startsWith('listen')) kd=kd==='listenWord'?'pickEn':'build';
    if(kd==='match'){ const seen=new Set(), pairs=[]; for(const w of shuffle(review)){ const t=tr(w).split(/[(/]/)[0].trim(); if(seen.has(t)) continue; seen.add(t); pairs.push([w.toLowerCase(),t]); if(pairs.length===5) break; } return {kind:'match',pairs}; }
    if(kd==='pickPt'||kd==='pickEn'||kd==='listenWord'){ const w=nextWord(); return {kind:kd,w:w.toLowerCase(),opts:shuffle([w,...others(w,review,kd==='listenWord'?3:2,kd==='pickPt'?tr:ds)]).map(x=>x.toLowerCase())}; }
    if(kd==='listenPick'){ const s=nextSent(); const o=shuffle(u.S.filter(x=>x!==s)).slice(0,2); return {kind:kd,s,opts:shuffle([s[BL()],...o.map(x=>x[BL()])])}; }
    return {kind:kd,s:nextSent()};
  });
}
function startLesson(s,i){
  refillHearts();
  if(S.hearts<=0) return noHearts(false);
  const k=UNITS.findIndex(u=>u.s===s);
  L={s,k,i,node:NODES[i],ex:buildExercises(k,NODES[i]),q:0,ok:0,tries:0,combo:0,best:0,t0:Date.now(),miss:[]};
  setBg('lbg');
  $('lesson').hidden=false; document.body.style.overflow='hidden';document.body.classList.add('busy'); whoosh();
  renderEx();
}
function footCheck(){ $('lfoot').className='lfoot'; $('lfootIn').innerHTML=`<button class="btn" id="lcheck" disabled>${T('check')}</button>`; $('lcheck').onclick=check; }
function listenBtns(){ return `<div class="listen"><button class="bigspk" id="say1" aria-label="Ouvir">${SPK}</button><button class="slow" id="say2">${T('slow')}</button></div>`; }
function renderEx(){
  const ex=L.ex[L.q]; L.sel=null; L.locked=false;
  L.target=ex.s?ex.s[TL()]:ex.w?sayW(ex.w):'';
  $('lprog').style.width=(L.q/L.ex.length*100)+'%'; $('lHearts').textContent=S.hearts;
  let h=L.combo>=3?`<div class="streakmsg">${T('inARow',L.combo)}</div>`:'';
  if(ex.kind==='pickPt'){
    const isNew=!S.seen[ex.w];
    h+=`${isNew?`<div class="newtag">${ICON.star} ${T('newWord')}</div>`:''}<h2 class="ltitle">${T('whatMeans')}</h2>
      <div class="sayrow"><div class="cat idle" id="exCat"></div><div class="say bigword"><button class="spk" id="say1" aria-label="Ouvir">${SPK}</button><span class="w" data-w="${ex.w}">${disp(ex.w)}</span></div></div>
      <div class="opts">${ex.opts.map(o=>`<button class="opt" data-o="${o}">${trn(o)}</button>`).join('')}</div>`;
  } else if(ex.kind==='pickEn'){
    h+=`<h2 class="ltitle">${T('howSay')}</h2>
      <div class="sayrow"><div class="cat idle" id="exCat"></div><div class="say bigword">"${trn(ex.w)}"</div></div>
      <div class="opts">${ex.opts.map(o=>`<button class="opt" data-o="${o}">${disp(o)}</button>`).join('')}</div>`;
  } else if(ex.kind==='listenWord'){
    h+=`<h2 class="ltitle">${T('whichHeard')}</h2>${listenBtns()}
      <div class="opts two">${ex.opts.map(o=>`<button class="opt" data-o="${o}">${disp(o)}</button>`).join('')}</div>`;
  } else if(ex.kind==='build'||ex.kind==='listenBuild'){
    let t=ex.s[TL()]; const start=/^[¿¡]/.test(t)?t[0]:''; if(start) t=t.slice(1);
    const end=/[?.!]$/.test(t)?t.slice(-1):'', words=(end?t.slice(0,-1):t).split(' '), low=words.map(w=>clean(w));
    let tiles=words.map((w,i)=>i===0&&w!=='I'&&!/^[A-Z]{2,}$/.test(w)?w.toLowerCase():w);
    const pool=shuffle([...new Set(UNITS[L.k].W.map(w=>sayW(w.toLowerCase())))].filter(w=>!w.includes(' ')&&!low.includes(w.toLowerCase())));
    tiles=tiles.concat(pool.slice(0,words.length>6?2:1));

function wInfo(k){ const p=pronOf(k); return `<b>${disp(k)}</b>${p?` (${p})`:''} = "${trn(k)}"`; }
function explain(ex,info){
  const mem=k=>hasMem()&&MEM[k]?`<div class="tipm">${MEM[k]}</div>`:'';
  const pt_=k=>typeof prepTip==='function'?prepTip([k]):'';

  if(ex.kind==='listenWord') return T('exListenWord',wInfo(ex.w),wInfo(info.chosen))+pt_(ex.w);
  if(ex.kind==='listenPick') return T('exListenPick',ex.s[TL()]);
  const want=L.words.map(clean), got=info.placed.map(clean);
  const extra=got.filter(x=>!want.includes(x)), missing=want.filter(x=>!got.includes(x)), parts=[];
  if(extra.length){ const k=lookup(extra[0]); parts.push(T('exExtra',extra[0],k?trn(k):'')); }
  if(missing.length) parts.push(T('exMissing',missing.join(', ')));
  if(!extra.length&&!missing.length){
    let i=0; while(i<want.length&&got[i]===want[i]) i++;
    parts.push(T('exOrder',got[i],want[i]));
    const fe=clean(ex.s.en.split(' ')[0]), d=DICT[fe], t=d?d.pt:'';
    if(/\?$/.test(ex.s[TL()])) parts.push(tip('q'));
    else if(/(ar|er|ir)\b/.test(t)&&!['the','i','we','this','it','our','there'].includes(fe)) parts.push(tip('cmd'));
    else parts.push(tip('order'));
  }
  if(ex.kind==='listenBuild') parts.push(T('exAgain'));

    if(!tipP&&!extra.length&&!missing.length){ const i2=want.findIndex((w,i)=>got[i]!==w); if(i2>=0) tipP=prepTip([want[i2],got[i2]],L.words.join(' ')); }

}

/* explosão de confete saindo do Turbi */
/* um único desenhista de confete: antes cada efeito rodava o seu, um apagava o outro e a tela piscava/pesava */
const FX={P:[],run:false};
function fxCanvas(){ const cv=$('confetti'); if(cv.width!==innerWidth||cv.height!==innerHeight){ cv.width=innerWidth; cv.height=innerHeight; } return cv; }
function fxLoop(){ const cv=fxCanvas(), x=cv.getContext('2d'); x.clearRect(0,0,cv.width,cv.height);
  FX.P=FX.P.filter(p=>--p.life>0&&p.y<cv.height+40);
  FX.P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; if(p.g) { p.vy+=p.g; p.vx*=.98; } p.a+=p.spin; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c;
    if(p.s){ x.beginPath(); x.arc(0,0,p.r*.6,0,7); x.fill(); } else x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
  if(FX.P.length) requestAnimationFrame(fxLoop); else { FX.run=false; x.clearRect(0,0,cv.width,cv.height); } }
function fxAdd(list){ FX.P.push(...list); if(FX.P.length>400) FX.P.splice(0,FX.P.length-400); if(!FX.run){ FX.run=true; requestAnimationFrame(fxLoop); } }
function burst(el){
  if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height*.35;
  const cols=['#2a62b0','#2fb4ff','#ffc93c','#ff8a3d','#3cc96a','#ff7eb3'];
  fxAdd(Array.from({length:46},()=>{ const a=Math.random()*Math.PI*2, v=3+Math.random()*6, rr=4+Math.random()*5; return {x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,g:.28,r:rr,w:rr,h:rr/2,c:cols[Math.random()*6|0],a:Math.random()*6,spin:.2,s:Math.random()<.4,life:70}; }));
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=fxCanvas(), cols=['#2a62b0','#2fb4ff','#ffc93c','#14b8a6','#ff8a3d','#ffffff'];
  fxAdd(Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,g:0,r:0,w:8+Math.random()*6,h:5,c:cols[Math.random()*6|0],a:Math.random()*6,spin:.1,s:false,life:180})));
}

const SCENE_THEMES=['meadow','mountains','farm','offshore','desert','snow','night','factory'];
const sceneOf=k=>k<8?SCENE_THEMES[Math.floor(k/2)]:SCENE_THEMES[(k-4)%SCENE_THEMES.length];
function scRand(seed){ let s=seed*9301+49297; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
/* turbina com hélice girando (giro em CSS, centro no cubo) */
function scTurb(x,y,h,o={}){
  const c=o.c||'#ffffff', sh=o.sh||'#cfdced', hub=o.hub||'#2a62b0', bl=h*.42, d=(o.d||3).toFixed(2), del=(-(o.p||0)*3).toFixed(2);
  const b=`M0 0C${-bl*.09} ${-bl*.3} ${-bl*.06} ${-bl*.8} 0 ${-bl}C${bl*.07} ${-bl*.8} ${bl*.1} ${-bl*.3} 0 0Z`;
  return `<g opacity="${o.op||1}"><path d="M${x-h*.025} ${y-h}L${x+h*.025} ${y-h}L${x+h*.045} ${y}L${x-h*.045} ${y}Z" fill="${c}"/><path d="M${x+h*.005} ${y-h}L${x+h*.025} ${y-h}L${x+h*.045} ${y}L${x+h*.012} ${y}Z" fill="${sh}"/>`+
    `<rect x="${x-h*.06}" y="${y-h-h*.035}" width="${h*.13}" height="${h*.06}" rx="${h*.03}" fill="${c}"/>`+
    `<g class="scrot" style="transform-origin:${x}px ${y-h}px;animation-duration:${d}s;animation-delay:${del}s"><g transform="translate(${x} ${y-h})" fill="${c}"><path d="${b}"/><path d="${b}" transform="rotate(120)"/><path d="${b}" transform="rotate(240)"/></g></g>`+
    `<circle cx="${x}" cy="${y-h}" r="${Math.max(1.4,h*.035)}" fill="${hub}"/>${o.light?`<circle class="scblink" cx="${x}" cy="${y-h-h*.04}" r="${Math.max(1.2,h*.025)}" fill="#ff4a5a"/>`:''}</g>`;
}
function scBirds(r,n,col){
  let s=''; for(let i=0;i<n;i++){ const y=50+r()*200, d=(14+r()*12).toFixed(1), del=(-r()*20).toFixed(1), sc=(.6+r()*.7).toFixed(2);

  return s;
}
function scClouds(r,n,col='#ffffff',op=.9){
  let s=''; for(let i=0;i<n;i++){ const y=30+r()*170, w=40+r()*50, d=(50+r()*40).toFixed(0), del=(-r()*90).toFixed(0);

function scGusts(r,n,col='#ffffff'){

function scFall(r,n,kind){

/* só anima as paisagens que estão visíveis na tela (economiza bateria) */
let scObs=null;
function watchScenes(){
  if(!('IntersectionObserver' in window)){ document.querySelectorAll('.uscene').forEach(e=>e.classList.add('play')); return; }
  if(scObs) scObs.disconnect();
  scObs=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('play',e.isIntersecting)),{rootMargin:'100px'});
  document.querySelectorAll('.uscene').forEach(e=>scObs.observe(e));
}

function avHash(s){ let h=2166136261; for(const c of String(s)) h=Math.imul(h^c.charCodeAt(0),16777619); return h>>>0; }
/* avatar padrão (para quem ainda não escolheu): sempre o mesmo para o mesmo nome */
function avDefault(seed){
  let h=avHash(seed||'turbi'); const nx=n=>{ h=Math.imul(h^(h>>>15),2246822507)>>>0; return h%n; };
  /* mesma ordem e mesmas opções da versão anterior, para os colegas sem avatar continuarem com o mesmo desenho */
  const o={}; AVOPT.forEach(p=>{ if(p.def){ o[p.k]=p.def; return; } const v=p.k==='hair'?p.v.slice(0,7):p.v; o[p.k]=p.sw?p.sw[nx(p.sw.length)]:v[nx(v.length)][0]; });
  o.mask='none'; o.shirt=nx(2)?'polo':'tee'; return o;
}
function avValid(o){
  if(!o||typeof o!=='object') return null; const r={};
  for(const p of AVOPT){ const v=o[p.k]===undefined&&p.def?p.def:o[p.k]; if(p.sw?p.sw.includes(v):p.v.some(x=>x[0]===v)) r[p.k]=v; else return null; }
  return r;
}

/* regrinhas das preposições do inglês, explicadas na língua da pessoa */
const PREP_RULE={
  in:L3('<b>IN</b> = dentro. Use para coisas dentro de algo (in the box, in the booth) e para lugares grandes (in the plant, in Florida).','<b>IN</b> = inside something (in the box, in the booth) and big places (in the plant, in Florida).','<b>IN</b> = dentro. Para cosas dentro de algo (in the box, in the booth) y lugares grandes (in the plant, in Florida).'),
  on:L3('<b>ON</b> = em cima, encostado na superfície (on the table, on the wall, on the floor).','<b>ON</b> = on top of a surface or touching it (on the table, on the wall, on the floor).','<b>ON</b> = encima, tocando la superficie (on the table, on the wall, on the floor).'),
  at:L3('<b>AT</b> = um ponto exato: um lugar (at the gate, at work) ou uma hora (at three, at 7 a.m.).','<b>AT</b> = an exact point: a place (at the gate, at work) or a time (at three, at 7 a.m.).','<b>AT</b> = un punto exacto: un lugar (at the gate, at work) o una hora (at three, at 7 a.m.).'),
  to:L3('<b>TO</b> = movimento, para onde você vai (go to the office, take it to the warehouse).','<b>TO</b> = movement, where you are going (go to the office, take it to the warehouse).','<b>TO</b> = movimiento, a dónde vas (go to the office, take it to the warehouse).'),
  under:L3('<b>UNDER</b> = embaixo de (under the table).','<b>UNDER</b> = below something (under the table).','<b>UNDER</b> = debajo de (under the table).'),
  behind:L3('<b>BEHIND</b> = atrás de (behind the box). O contrário é <b>IN FRONT OF</b> = na frente de.','<b>BEHIND</b> = at the back of (behind the box). The opposite is <b>IN FRONT OF</b>.','<b>BEHIND</b> = detrás de (behind the box). Lo contrario es <b>IN FRONT OF</b> = enfrente de.'),
  'in front of':L3('<b>IN FRONT OF</b> = na frente de (in front of the office). O contrário é <b>BEHIND</b> = atrás de.','<b>IN FRONT OF</b> = facing the front of something. The opposite is <b>BEHIND</b>.','<b>IN FRONT OF</b> = enfrente de. Lo contrario es <b>BEHIND</b> = detrás de.'),
  'next to':L3('<b>NEXT TO</b> = ao lado de, encostadinho (next to the door).','<b>NEXT TO</b> = right beside something (next to the door).','<b>NEXT TO</b> = al lado de (next to the door).'),
  between:L3('<b>BETWEEN</b> = entre duas coisas (between the two boxes).','<b>BETWEEN</b> = in the middle of two things (between the two boxes).','<b>BETWEEN</b> = entre dos cosas (between the two boxes).'),
  above:L3('<b>ABOVE</b> = acima de, mais alto e sem encostar (the shelf above the table).','<b>ABOVE</b> = higher than something, not touching it (the shelf above the table).','<b>ABOVE</b> = arriba de, más alto y sin tocar (the shelf above the table).'),
  near:L3('<b>NEAR</b> = perto de (near the exit).','<b>NEAR</b> = close to (near the exit).','<b>NEAR</b> = cerca de (near the exit).'),
  from:L3('<b>FROM</b> = de onde vem, a origem (from Brazil, from the warehouse).','<b>FROM</b> = where something comes from (from Brazil, from the warehouse).','<b>FROM</b> = de dónde viene, el origen (from Brazil, from the warehouse).'),
};
const PREP_WORDS=['in front of','next to','between','behind','under','above','near','from','into','on','in','at','to'];
/* deixa as preposições coloridas nas frases em inglês (o texto já vem escapado) */
function hiPrep(html){ if(TL()!=='en') return html;
  return html.replace(/\b(in front of|next to|between|behind|under|above|near|from|into|on|in|at|to)\b/gi,'<b class="prep">$1</b>'); }
function prepTip(words,ctx){ if(TL()!=='en') return ''; const c=' '+clean(ctx||'')+' ';
  let w=words.map(x=>clean(x)).find(x=>PREP_RULE[x]||x==='next'||x==='front'||x==='of');
  if(!w) return '';
  if((w==='to'||w==='next')&&/ next to /.test(c)) w='next to';
  if((w==='in'||w==='front'||w==='of')&&/ in front of /.test(c)) w='in front of';
  return PREP_RULE[w]?`<div class="tipm prept">${avL(PREP_RULE[w])}</div>`:''; }

/* cenas desenhadas para as preposições */
function prepItem(k,x,y,s){ s=s||1;
  const g=(inner)=>`<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;
  if(k==='wrench') return g(`<path d="M-26 4L14 4" stroke="#8a95a8" stroke-width="7" stroke-linecap="round"/><path d="M14 -6a10 10 0 1 1 0 20a10 10 0 0 1 0-20z" fill="#8a95a8"/><rect x="16" y="0" width="12" height="8" fill="#fff"/>`);
  if(k==='hammer') return g(`<rect x="-4" y="-22" width="8" height="34" rx="3" fill="#b8742a"/><rect x="-16" y="-28" width="32" height="12" rx="3" fill="#5b6275"/>`);
  if(k==='bucket') return g(`<path d="M-18 -20H18L14 14H-14Z" fill="#ff8a3d"/><path d="M-18 -20Q0 -38 18 -20" stroke="#5b6275" stroke-width="3" fill="none"/><rect x="-18" y="-22" width="36" height="5" rx="2" fill="#e06a1c"/>`);
  if(k==='tape') return g(`<rect x="-16" y="-16" width="32" height="32" rx="8" fill="#ffc93c"/><circle cx="0" cy="0" r="7" fill="#5b6275"/><rect x="14" y="8" width="16" height="6" fill="#e0a400"/>`);
  if(k==='helmet') return g(`<path d="M-20 4C-20 -18 20 -18 20 4Z" fill="#ffd23f"/><rect x="-26" y="2" width="52" height="7" rx="3" fill="#e0b400"/>`);
  if(k==='gloves') return g(`<path d="M-14 14V-6Q-14 -14 -8 -14V-20Q-4 -24 0 -20V-22Q4 -26 8 -22V-18Q12 -20 14 -16V14Z" fill="#3d8bff"/><rect x="-14" y="10" width="28" height="8" rx="2" fill="#1f5fc4"/>`);
  if(k==='drill') return g(`<rect x="-22" y="-14" width="34" height="16" rx="5" fill="#3cc96a"/><rect x="12" y="-10" width="16" height="6" fill="#8a95a8"/><path d="M-12 2L-6 22H6L2 2Z" fill="#29a352"/>`);
  return '';
}
function prepScene(item,pos){
  const box=(x,col,w)=>{ w=w||58; return `<g><rect x="${x}" y="110" width="${w}" height="44" rx="4" fill="${col||'#c98d62'}"/><rect x="${x}" y="110" width="${w}" height="10" fill="rgba(0,0,0,.12)"/></g>`; };
  let back='', front='';
  const table=`<rect x="20" y="96" width="170" height="10" rx="3" fill="#8a5a2b"/><rect x="30" y="106" width="9" height="62" fill="#6b4420"/><rect x="171" y="106" width="9" height="62" fill="#6b4420"/>`;
  const shelf=`<rect x="34" y="34" width="142" height="7" rx="2" fill="#9aa0a8"/><rect x="44" y="41" width="5" height="12" fill="#9aa0a8"/><rect x="161" y="41" width="5" height="12" fill="#9aa0a8"/>`;
  const floor=`<rect x="0" y="168" width="320" height="22" fill="#dfe6f0"/>`;

    task.innerHTML=h; drawMTiles(); mFoot(`<button class="btn" id="mgo" disabled>${mt('check')}</button>`); $('mgo').onclick=checkStep;
  } else if(s.t==='pic'){
    if(MI.shown!==MI.i) chatAdd('sup',mx(s.line)); supSay(mx(s.line));
    MI.order=shuffle(s.opts.map((o,k)=>k));
    h=`<div class="pwrap">${prepScene(s.item,s.pos)}</div>`+`<div class="opts">${MI.order.map(k=>`<button class="opt wide mopt" data-k="${k}"><span class="spk mini">${SPK}</span><span>${hiPrep(esc(mx(s.opts[k])))}</span></button>`).join('')}</div>`;
    task.innerHTML=h; mFoot(`<button class="btn" id="mgo" disabled>${mt('check')}</button>`); $('mgo').onclick=checkStep;
  } else if(s.t==='speak'){
    const tx=mx(s.ans);
    h=turbiRow(`${mt('qSpeak')} <b>"${esc(tx)}"</b><br><small style="font-weight:700;color:var(--muted,#6b7a90)">${esc(mb(s.ans))}</small>`,'think')
      +`<div class="listen mlisten"><button class="slow" id="mrep">${SPK} ${mt('listen')}</button><button class="slow" id="mslow">${mt('slow')}</button></div>`
      +`<button class="micbtn" id="mmic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg><span id="mmicT">${mt('tapTalk')}</span></button><p class="pt" id="mheard" style="text-align:center;margin:0"></p>`;
    task.innerHTML=h; $('mrep').onclick=()=>supSay(tx); $('mslow').onclick=()=>speakSlow(tx);
    $('mmic').onclick=()=>listenMic(tx);
    mFoot(`<button class="btn ghost" id="mgo">${mt('saidIt')}</button>`); $('mgo').onclick=()=>speakOk(tx,true);
    if(!SRec) $('mheard').textContent=mt('noMic');
  }
  MI.shown=MI.i; mScroll();
  const ct=$('mCatT'); if(ct) setCat(ct,ct.classList.contains('happy')?'happy':'think');
}
function drawMTiles(){
  $('mzone').innerHTML=MI.placed.map(id=>`<button class="tile" data-id="${id}">${esc(MI.tiles[id].w)}</button>`).join('');
  $('mbank').innerHTML=MI.tiles.map(t=>`<button class="tile ${MI.placed.includes(t.id)?'ghost':''}" data-id="${t.id}">${esc(t.w)}</button>`).join('');
  if($('mgo')) $('mgo').disabled=!MI.placed.length;
}
function checkStep(){
  const s=MI.m.steps[MI.i]; let ok;
  if(s.t==='build') ok=MI.placed.map(id=>clean(MI.tiles[id].w)).join(' ')===MI.words.map(clean).join(' ');
  else ok=MI.sel===0;
  if(ok) stepRight(s); else stepWrong(s);
}
function chunkTip(s){
  let h='';
  if(s.rule&&TL()==='en'&&PREP_RULE[s.rule]) h+=`<div class="mchunk prept"><small>${mt('rule')}</small><span>${avL(PREP_RULE[s.rule])}</span></div>`;
  if(s.chunk) h+=`<div class="mchunk"><small>${mt('useful')}</small><b>${hiPrep(esc(mx(s.chunk)))}</b> = ${esc(mb(s.chunk))}</div>`;
  else if(s.t==='pic') h+=`<div class="mchunk"><small>${mt('useful')}</small><b>${hiPrep(esc(mx(s.opts[0])))}</b> = ${esc(mb(s.opts[0]))}</div>`;
  return h; }
function stepRight(s){
  sGood(1); const sp=$('mCatT'); if(sp){ setCat(sp,'happy'); sp.classList.add('party'); burst(sp); }
  if(s.t==='reply'||s.t==='pic'){ chatAdd('me',mx(s.opts[0])); supSay(mx(s.opts[0])); }
  if(s.t==='build'){ chatAdd('me',mx(s.ans)); supSay(mx(s.ans)); }
  if(s.t==='hear'||s.t==='speak') { /* nada a acrescentar no chat */ }
  if(s.t!=='reply'&&s.t!=='build') turbiSay(mt('right'));
  $('mtask').querySelectorAll('button').forEach(b=>b.disabled=true);
  mFoot(`<div class="fbh"><div class="cat happy party fcat">${catSVG('happy')}</div><h3>${mt('right')}</h3></div>${chunkTip(s)}<button class="btn" id="mgo">${mt('cont')}</button>`,'good');
  $('mgo').onclick=()=>{ sTap(); nextStep(); };
}
function stepWrong(s){
  sBad(); MI.errs++; const c=$('mCatT'); if(c) setCat(c,'sad');
  let why='';
  if(s.t==='pic'&&MI.sel!=null){ const o=s.opts[MI.sel]; why=`<b>"${esc(mx(o))}"</b> = "${esc(mb(o))}". `+(TL()==='en'&&PREP_RULE[s.rule]?avL(PREP_RULE[s.rule]):''); turbiSay(mt('lookAgain')); }
  else if(s.t==='reply'&&MI.sel!=null){ const o=s.opts[MI.sel]; why=`<b>"${esc(mx(o))}"</b> = "${esc(mb(o))}". `+(s.why[MI.sel]?avL(s.why[MI.sel]):''); turbiSay((s.why[MI.sel]?avL(s.why[MI.sel]):'')); }
  else if(s.t==='hear'){ why=`${mt('meaning')} <b>"${esc(mx(s.line))}"</b> = "${esc(mb(s.line))}"`; turbiSay(mt('wrong')); }
  else { why=`<b>${esc(mx(s.ans))}</b> = "${esc(mb(s.ans))}"`; turbiSay(mt('wrong')); }
  mFoot(`<div class="fbh"><div class="cat sad fcat">${catSVG('sad')}</div><h3>${mt('wrong')}</h3></div><div class="whyx">${why}</div><button class="btn red" id="mgo">${mt('cont')}</button>`,'bad');
  $('mgo').onclick=()=>{ sTap(); MI.i--; nextStep(); };
}
/* reconhecimento de voz (quando o celular permite) */
const SRec=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let MREC=null;
/* compara o que a pessoa falou com a frase: aceita contrações (I'll = I will) e números (7 = seven) */
const NUMW={0:'zero',1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten',11:'eleven',12:'twelve',15:'fifteen',20:'twenty',30:'thirty',80:'eighty',100:'hundred'};
const NUMPT={1:'um',2:'dois',3:'tres',4:'quatro',5:'cinco',6:'seis',7:'sete',8:'oito',9:'nove',10:'dez',80:'oitenta'};
const NUMES={1:'uno',2:'dos',3:'tres',4:'cuatro',5:'cinco',6:'seis',7:'siete',8:'ocho',9:'nueve',10:'diez',80:'ochenta'};
const CONTR={"i'll":'i will',"it's":'it is',"i'm":'i am',"don't":'do not',"can't":'cannot',"that's":'that is',"let's":'let us',"he's":'he is',"she's":'she is',"we're":'we are',"you're":'you are',"they're":'they are',"isn't":'is not',"won't":'will not',"what's":'what is',"where's":'where is',"o'clock":'oclock'};
const normW=t=>{ let x=String(t).toLowerCase().replace(/[’`]/g,"'").normalize('NFD').replace(/[̀-ͯ]/g,'');
  Object.keys(CONTR).forEach(c=>{ x=x.split(c).join(CONTR[c]); });
  const nm=TL()==='pt'?NUMPT:TL()==='es'?NUMES:NUMW;
  x=x.replace(/\d+/g,d=>nm[+d]||d).replace(/[^a-z0-9 ]/g,' ');
  return x.split(/\s+/).filter(Boolean).map(w=>w==='ok'?'okay':w); };
/* palavras "pequenas" contam menos: o importante é acertar as palavras principais */
const STOPW=new Set('i you he she it we they me my your the a an is am are be to of in on at and or please do not so now too ok okay o a os as um uma de da do em no na eu voce e el la los las un una y yo tu es que me por favor'.split(' '));
function micQuiet(on){ try{ if(!MUS.on||!MUS.bus) return; const t=ac.currentTime; MUS.bus.gain.cancelScheduledValues(t);
  MUS.bus.gain.setTargetAtTime(on?.0001:Math.max(S.music.vol*MUSIC_GAIN,.001),t,.08); }catch(e){} }
let MREC_T=null;
function listenMic(tx){
  const heard=$('mheard'); if(!heard) return;
  if(!SRec){ heard.textContent=mt('noMic'); return; }
  if(MREC){ try{ MREC._stop=true; MREC.stop(); }catch(e){} return; }   /* tocar de novo = parar de ouvir */
  try{ speechSynthesis.cancel(); }catch(e){}
  const stepAt=MI&&MI.i, r=new SRec(); MREC=r; r.lang=TTSL[TL()]; r.interimResults=false; r.maxAlternatives=5; r.continuous=false;
  $('mmic').classList.add('on'); $('mmicT').textContent=mt('listening'); heard.textContent='';
  micQuiet(true);
  let got=false;
  r.onresult=e=>{ if(r._stop&&r._manual) return; got=true; if(!MI||MI.i!==stepAt) return;
    const want=normW(tx), alts=[...e.results[0]].map(a=>a.transcript);
    const key=want.filter(x=>!STOPW.has(x));
    const score=a=>{ const w=normW(a); if(!want.length) return 0; const all=want.filter(x=>w.includes(x)).length/want.length;
      const imp=key.length?key.filter(x=>w.includes(x)).length/key.length:all; return Math.min(all,imp); };
    const best=alts.reduce((b,a)=>score(a)>score(b)?a:b,alts[0]||'');
    if($('mheard')) $('mheard').innerHTML=`${mt('heard')} <b>"${esc(best)}"</b>`;
    if(score(best)>=(want.length<=3?.66:.6)) speakOk(tx,false); else { if($('mheard')) $('mheard').innerHTML+=`<br>${mt('retryMic')}`; sBad(); } };
  r.onerror=e=>{ if(r._manual||!$('mheard')) return;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture') $('mheard').textContent=mt('noMic');
    else if(e.error==='network') $('mheard').textContent=mt('noNet');
    else if(!got) $('mheard').textContent=mt('retryMic'); };
  r.onend=()=>{ clearTimeout(MREC_T); if(MREC===r) MREC=null; micQuiet(false);
    if($('mmic')){ $('mmic').classList.remove('on'); $('mmicT').textContent=mt('tapTalk'); }
    if(!got&&!r._manual&&$('mheard')&&!$('mheard').textContent) $('mheard').textContent=mt('retryMic'); };
  /* se o celular não responder em 8 segundos, para de ouvir */
  clearTimeout(MREC_T); MREC_T=setTimeout(()=>{ try{ if(MREC===r) r.stop(); }catch(e){} },8000);
  try{ r.start(); }catch(e){ MREC=null; micQuiet(false); heard.textContent=mt('noMic'); $('mmic').classList.remove('on'); $('mmicT').textContent=mt('tapTalk'); }
}
function speakOk(tx,manual){
  if(!MI||MI.done_i===MI.i) return; MI.done_i=MI.i;
  clearTimeout(MREC_T); try{ if(MREC){ MREC._manual=true; MREC.abort(); } }catch(e){} MREC=null; micQuiet(false);
  chatAdd('me',tx); stepRight(MI.m.steps[MI.i]);
}
function finishMission(){
  const m=MI.m, first=!(S.missions&&S.missions[m.id]), xp=first?20:5, gems=MI.errs===0?15:10;
  S.missions=S.missions||{}; S.missions[m.id]=1; S.xp+=xp; S.gems+=gems;
  const t=today(); if(S.day.d!==t) S.day={d:t,xp:0}; S.day.xp+=xp;
  if(S.last!==t){ const y=new Date(Date.now()-864e5).toDateString(); S.streak=S.last===y?S.streak+1:1; S.last=t; }
  S.days=(S.days||[]).filter(d=>Date.now()-new Date(d).getTime()<7*864e5); if(!S.days.includes(t)) S.days.push(t);
  save(); renderTop();
  const chunks=m.steps.filter(s=>s.chunk||s.t==='pic').map(s=>s.chunk?s:{chunk:s.opts[0]});
  $('mtask').innerHTML=''; $('mchat').innerHTML='';
  $('mtask').innerHTML=`<div class="mend"><div class="cat happy bigcat" id="mCatE"></div><h2>${mt('missDone')}</h2>
    <div class="tiles3"><div class="t3" style="--c:var(--gold-d)"><small>XP</small><b>${ICON.bolt}${xp}</b></div><div class="t3" style="--c:var(--blue)"><small>${mt('rewards')}</small><b>${ICON.gem}${gems}</b></div></div>
    <div class="mist"><div class="lbl">${mt('learned')}</div>${chunks.map((s,i)=>`<div class="row"><span>${hiPrep(esc(mx(s.chunk)))}<small>${esc(mb(s.chunk))}</small></span>${canSpeak?`<button class="spk" data-c="${i}" aria-label="${mt('listen')}">${SPK}</button>`:''}</div>`).join('')}</div>
    <div class="mchunk mweek"><small>${ICON.flame} ${mt('week')}</small>${mt('weekTxt')}<b>"${esc(mx(m.week))}"</b><span>${esc(mb(m.week))}</span></div></div>`;
  setCat($('mCatE'),'happy'); $('mCatE').classList.add('bigcat');
  $('mtask').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>supSay(mx(chunks[+b.dataset.c].chunk)));
  turbiSay(mt('missDone')); sWin(); confetti();
  mFoot(`<button class="btn" id="mgo">${mt('cont')}</button>`); $('mgo').onclick=exitMission;
  $('mprog').style.width='100%'; $('mbody').scrollTop=0;
}
function exitMission(){
  clearTimeout(MREC_T); try{ if(MREC){ MREC._manual=true; MREC.abort(); } }catch(e){} MREC=null; micQuiet(false); try{ speechSynthesis.cancel(); }catch(e){}
  MI=null; $('mission').hidden=true; document.body.style.overflow=''; document.body.classList.remove('busy'); renderTab();
}
$('mtask').onclick=e=>{
  if(!MI) return; const s=MI.m.steps[MI.i]; if(!s) return;
  const o=e.target.closest('.opt');
  if(o&&!o.disabled){ $('mtask').querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===o)); MI.sel=+o.dataset.k; sTap();
    if(s.t==='reply'||s.t==='pic') supSay(mx(s.opts[MI.sel]));
    $('mgo').disabled=false; return; }
  const t=e.target.closest('.tile');
  if(t&&!t.disabled){ const id=+t.dataset.id;
    if(t.closest('#mbank')){ if(!MI.placed.includes(id)){ MI.placed.push(id); blip(700,1000,.06,'sine',.1); } }
    else { MI.placed.splice(MI.placed.indexOf(id),1); blip(600,400,.06,'sine',.1); }
    drawMTiles(); }
};
$('mquit').onclick=()=>{
  modal(`<div class="cat sad" id="mCat"></div><h3>${mt('quitQ')}</h3>
    <button class="btn blue" id="mStay">${mt('stay')}</button><button class="btn ghost" id="mLeave" style="color:var(--bad)">${mt('leave')}</button>`);
  setCat($('mCat'),'sad');
  $('mStay').onclick=closeModal; $('mLeave').onclick=()=>{ closeModal(); exitMission(); };
};

applyStatic(); $('iPick').innerHTML=pickerHTML(); $('flagBtn').onclick=openCoursePicker;
buildScenes(); refillHearts(); goTab('path'); setTimeout(()=>prerender(),300);
if(ME){ cloudRestore().then(b=>{ if(b){ refillHearts(); goTab(curTab); } else syncCloud(); }); }
/* ===== ATUALIZAÇÃO AUTOMÁTICA: se existir uma versão nova no site, o app recarrega sozinho ===== */
const APP_VER='22';
/* usa a pergunta "mudou?" do navegador: se nada mudou, o site responde vazio (quase não gasta dados) */
let lastCheck=0;
function checkUpdate(){
  if(!/^https?:/.test(location.protocol)||Date.now()-lastCheck<30*60000) return; lastCheck=Date.now();
  fetch(location.pathname,{cache:'no-cache'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=/const APP_VER='(\d+)'/.exec(t||''); if(!m||m[1]===APP_VER) return;
    let tried=''; try{ tried=sessionStorage.getItem('bw-upd')||''; }catch(e){}
    if(tried===m[1]) return; try{ sessionStorage.setItem('bw-upd',m[1]); }catch(e){}
    location.replace(location.pathname+'?v='+m[1]);
  }).catch(()=>{});
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });
(function intro(){
  if(!HAS_COURSE){ $('introGo').hidden=true; $('iBub').hidden=true; }
  setCat($('introCat'),'happy'); setTimeout(()=>setCat($('introCat'),'idle'),2000);

    unlockAudio(); unlockPool(); if(canSpeak) unlockSpeech();
    if(A(true)){ whoosh(); [523,659,784,1047].forEach((f,i)=>{ blip(f,f,.14,'square',.06,.15+i*.1); bell(f*2,.15+i*.1,.1); }); bell(2093,.6,.14); meow(true,.75); }
    $('intro').classList.add('out');
    setTimeout(()=>{ $('intro').hidden=true; const c=document.querySelector('.nodewrap.current'); if(c) c.scrollIntoView({block:'center',behavior:'smooth'}); },550);
  };
})();
