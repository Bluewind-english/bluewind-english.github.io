<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English">
<meta name="application-name" content="Bluewind English">
<meta name="theme-color" content="#2a62b0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Bluewind English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: bright learning-path app — white ground, chunky 3D buttons, one color per unit (Aeroporto azul, Hotel roxo, Fábrica laranja, Dia a dia verde-menta) */
:root{
  --bg:#ffffff; --bg2:#f6f8fc; --line:#e4e8f1; --ink:#2b3150; --muted:#8a91ab;
  --good:#3cc96a; --good-d:#29a352; --good-bg:#dcf8e5;
  --bad:#ff5a5f; --bad-d:#d93f44; --bad-bg:#ffe3e4;
  --blue:#2fb4ff; --blue-d:#1a8fd0; --gold:#ffc93c; --gold-d:#e0a400; --gold-ink:#5a3d00;
  --navy:#16285a; --pink:#ff7eb3;
  --tP:#ff8a3d; --tC:#2fb4ff; --tQ:#a874ff; --tB:#20c98a;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
[hidden]{display:none!important}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:900}

/* botões 3D */
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-weight:900;font-size:17px;letter-spacing:.6px;text-transform:uppercase;
  background:var(--c,var(--good));color:#fff;box-shadow:0 4px 0 var(--cd,var(--good-d));transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--cd,var(--good-d))}
.btn:disabled{background:var(--line);color:#b3b9cc;box-shadow:0 4px 0 #d3d8e5;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.blue{--c:var(--blue);--cd:var(--blue-d)} .btn.red{--c:var(--bad);--cd:var(--bad-d)} .btn.gold{--c:var(--gold);--cd:var(--gold-d);color:var(--gold-ink)}

/* app shell */
.app{position:relative;z-index:0;isolation:isolate;max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:2px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.flag{font-family:var(--display);font-size:15px;color:#fff;background:var(--navy);padding:4px 9px;border-radius:10px;letter-spacing:.5px}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.stat svg{width:24px;height:24px}
.st-streak{color:var(--tP)} .st-gem{color:var(--blue)} .st-heart{color:var(--bad)}
.stat.off{color:#c3c8d6}
.tab{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center;
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{display:flex;gap:6px;width:100%;max-width:560px;justify-content:space-around}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:14px;border:2px solid transparent;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;flex:1}
.nav button svg{width:28px;height:28px}
.nav button[aria-current="true"]{background:#e8f6ff;border-color:#a6dcff;color:var(--blue-d)}

/* trilha */
.unit{display:flex;flex-direction:column;align-items:center;gap:0}
.ubanner{width:100%;border-radius:18px;padding:16px 16px 18px;background:var(--uc);color:#fff;box-shadow:0 5px 0 var(--ud);display:flex;align-items:center;gap:12px;margin-bottom:60px}
.ubanner.locked{background:#d9dee9;box-shadow:0 5px 0 #c3c9d8}
.ubanner .ut{flex:1;min-width:0}
.ubanner small{display:block;font-size:13px;font-weight:900;opacity:.85;text-transform:uppercase;letter-spacing:1px}
.ubanner b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05}
.ubanner span{display:block;font-size:14px;font-weight:800;opacity:.95}
.ubanner .ucount{font-family:var(--display);font-size:20px;background:rgba(255,255,255,.22);border-radius:12px;padding:6px 10px;white-space:nowrap}
.nodes{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;padding-bottom:30px}
.nodewrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:76px;height:70px;border-radius:50%;background:var(--uc);box-shadow:0 7px 0 var(--ud);display:grid;place-items:center;color:#fff;transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ud)}
.node svg{width:36px;height:36px}
.node.locked{background:#e3e7f0;box-shadow:0 7px 0 #c9cfdd;color:#aeb5c8}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d);color:#fff}
.node.chest,.node.trophy{background:transparent;box-shadow:none;width:84px;height:76px}
.node.chest svg,.node.trophy svg{width:64px;height:64px}
.nodewrap.current .node:not(.chest):not(.trophy){outline:7px solid color-mix(in srgb,var(--uc) 28%,transparent);outline-offset:4px}
.start-tag{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:#fff;color:var(--uc);border:2px solid var(--line);font-weight:900;font-size:14px;padding:7px 12px;border-radius:12px;white-space:nowrap;letter-spacing:.8px;animation:float 1.4s ease-in-out infinite}
.start-tag::after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff}
@keyframes float{50%{transform:translate(-50%,-5px)}}
.pathcat{position:absolute;width:96px;height:96px}
.popover{position:absolute;top:calc(100% + 14px);left:calc(50% - var(--o,0px));transform:translateX(-50%);z-index:5;width:250px;background:var(--uc);color:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(30,40,80,.25)}
.popover.locked{background:#f1f3f8;color:var(--muted);border:2px solid var(--line)}
.popover::before{content:"";position:absolute;bottom:100%;left:calc(50% + var(--o,0px));margin-left:-9px;border:9px solid transparent;border-bottom-color:var(--uc)}
.popover.locked::before{border-bottom-color:#f1f3f8}
.popover b{font-size:18px;font-weight:900}
.popover span{font-size:14px;font-weight:800;opacity:.92}
.popover .btn{background:#fff;color:var(--uc);box-shadow:0 4px 0 rgba(0,0,0,.18);padding:12px}

/* lição */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.lhead{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:620px;width:100%;margin:0 auto}
.xbtn{width:36px;height:36px;display:grid;place-items:center;color:#b3b9cc;font-size:30px;font-weight:900;line-height:1}
.prog{flex:1;height:16px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:var(--good);position:relative;transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.lhearts{display:flex;align-items:center;gap:4px;color:var(--bad);font-weight:900;font-size:18px}
.lhearts svg{width:26px;height:26px}
.mq{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#b3b9cc;border:2px solid var(--line)}
.mq.on{background:var(--pink);border-color:var(--pink);color:#fff}
.lbody{flex:1;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 200px max(16px,env(safe-area-inset-left,0px));max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ltitle{font-family:var(--body);font-weight:900;font-size:24px;margin:0;line-height:1.2;text-wrap:balance}
.newtag{display:inline-flex;align-items:center;gap:6px;color:var(--tQ);font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.streakmsg{color:var(--tP);font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:1px}
.sayrow{display:flex;align-items:flex-end;gap:10px}
.sayrow .cat{width:96px;height:96px}
.say{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:18px;font-weight:800;line-height:1.35;margin-bottom:22px;background:#fff}
.say::before{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.sentence{font-size:22px;font-weight:800;line-height:1.5}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--line);text-align:center;color:var(--blue-d);padding:0 4px}
.lines{min-height:112px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 54px,var(--line) 54px 56px);padding:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{background:#fff;border:2px solid var(--line);border-bottom-width:4px;padding:9px 13px;border-radius:14px;font-size:18px;font-weight:800;color:var(--ink)}
.tile:active{transform:translateY(2px)}
.tile.ghost{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
.opts{display:grid;gap:12px}
.opt{text-align:center;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:16px;font-size:19px;font-weight:800}
.opt.wide{text-align:left;font-size:17px}
.opt[aria-pressed="true"]{background:#e8f6ff;border-color:#84cfff;color:var(--blue-d)}
.opt.okk{background:var(--good-bg);border-color:var(--good);color:var(--good-d)}
.opt.nok{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-d)}
.listen{display:flex;gap:14px;align-items:center;justify-content:center;padding:6px 0}
.bigspk{width:104px;height:104px;border-radius:24px;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);color:#fff;display:grid;place-items:center}
.bigspk svg{width:52px;height:52px}
.slow{width:68px;height:68px;border-radius:18px;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);color:#fff;font-weight:900;font-size:12px;display:grid;place-items:center;text-transform:uppercase}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:12px}
.mbtn{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 8px;font-size:17px;font-weight:800;min-height:58px}
.mbtn[aria-pressed="true"]{background:#e8f6ff;border-color:#84cfff;color:var(--blue-d)}
.mbtn.okk{background:var(--good-bg);border-color:var(--good);color:var(--good-d)}
.mbtn.nok{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-d);animation:shake .35s}
.mbtn.gone{opacity:.35;pointer-events:none;background:var(--bg2);color:var(--muted)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.lfoot{position:fixed;left:0;right:0;bottom:0;z-index:21;border-top:2px solid var(--line);background:#fff;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:78vh;overflow-y:auto}
.lfoot.good{background:var(--good-bg);border-top-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-top-color:transparent}
.lfoot-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.fbh{display:flex;align-items:center;gap:10px}
.fbh .badge{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.fbh .badge svg{width:26px;height:26px}
.fbh h3{margin:0;font-size:24px;font-weight:900;flex:1}
.lfoot.good h3{color:var(--good-d)} .lfoot.bad h3{color:var(--bad-d)}
.fbx{font-size:15px;font-weight:800;line-height:1.4}
.lfoot.good .fbx{color:var(--good-d)} .lfoot.bad .fbx{color:var(--bad-d)}
.full{display:flex;gap:10px;align-items:flex-start;font-size:18px;font-weight:800;color:var(--ink)}
.full span{flex:1;min-width:0}
.spk{flex:none;width:40px;height:40px;border-radius:12px;background:var(--blue);box-shadow:0 3px 0 var(--blue-d);color:#fff;display:grid;place-items:center}
.spk svg{width:22px;height:22px}
.pt{font-size:15px;color:var(--muted);font-weight:800}
.why{background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;line-height:1.45;color:var(--ink)}
.why .lbl{display:block;margin-bottom:3px;color:var(--blue-d)}
.whyx{background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;line-height:1.45;border-left:5px solid var(--bad);color:var(--ink)}
.whyx .lbl{display:block;margin-bottom:3px;color:var(--bad-d)}
.mine{font-size:15px;font-weight:800;color:var(--muted)}
.mine s{color:var(--bad-d);text-decoration-thickness:2px}
.xpg{font-family:var(--display);color:var(--gold-d);font-size:20px}

/* fim de lição */
.done{align-items:center;justify-content:center;text-align:center;overflow-y:auto}
.done-in{max-width:460px;width:100%;margin:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:18px}
.done .bigcat{width:170px;height:170px}
.done h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0;color:var(--gold-d);line-height:1.05}
.done p{margin:0;color:var(--muted);font-weight:800}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.t3{border-radius:16px;border:2px solid var(--c);overflow:hidden;background:var(--c)}
.t3 small{display:block;color:#fff;font-weight:900;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:5px 2px}
.t3 b{display:flex;align-items:center;justify-content:center;gap:4px;background:#fff;color:var(--c);border-radius:13px;padding:12px 2px;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.t3 b svg{width:20px;height:20px}
.mist{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.mist .row{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:800}
.mist .row span{flex:1;min-width:0}
.mist .row small{display:block;color:var(--muted);font-weight:700}
.flame{width:150px;height:150px;animation:flick 1s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.06) rotate(-2deg)}}
.bigstreak{font-family:var(--display);font-size:90px;color:var(--tP);line-height:.9}
.week{display:flex;gap:8px}
.week i{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900;color:var(--muted)}
.week i.on{background:var(--tP);color:#fff}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,28,60,.5);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mcard{width:100%;max-width:460px;background:#fff;border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;animation:up .25s ease-out}
.mcard h3{margin:0;font-size:24px;font-weight:900}
.mcard p{margin:0;color:var(--muted);font-weight:800}
.mcard .cat{width:110px;height:110px}
.chestbig{width:140px;height:140px;animation:wob .5s ease-in-out 3}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* perfil, caderneta, rádio */
.card{border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;gap:14px}
.ph .cat{width:100px;height:100px}
.ph h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1}
.ph p{margin:4px 0 0;color:var(--muted);font-weight:800}
.xpbar{height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbox{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}
.sbox svg{width:30px;height:30px;flex:none}
.sbox b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.sbox span{font-size:13px;color:var(--muted);font-weight:800}
.goal{display:flex;align-items:center;gap:16px}
.goal svg{width:84px;height:84px;flex:none}
.goal b{font-size:18px;font-weight:900;display:block}
.goal span{color:var(--muted);font-weight:800;font-size:14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:900}
.toggle{width:54px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:left .2s}
.toggle[aria-pressed="true"]{background:var(--good)}
.toggle[aria-pressed="true"]::after{left:26px}
.wlist{display:flex;flex-direction:column;gap:8px}
.wrowbtn{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 12px;text-align:left}
.wrowbtn b{font-size:18px;font-weight:900;min-width:0}
.wrowbtn span{flex:1;min-width:0;color:var(--muted);font-weight:800;font-size:14px}
.boxes{display:flex;gap:3px;flex:none}
.boxes i{width:10px;height:6px;border-radius:3px;background:var(--line)}
.boxes i.on{background:var(--good)}
.empty{color:var(--muted);font-weight:800;text-align:center;padding:12px}
.h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.scenes{display:flex;gap:8px;flex-wrap:wrap}
.scene{padding:9px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;font-weight:900;font-size:15px}
.scene[aria-pressed="true"]{background:#ffe9f3;border-color:var(--pink);color:#d4407e}
.rnow{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:800;font-size:14px;min-height:20px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--pink);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.rrow{display:flex;align-items:center;gap:10px}

/* mascote */
.cat{width:84px;height:94px;flex:none;cursor:pointer;transform-origin:50% 100%}
.tw{position:relative;width:100%;height:100%;transform-origin:50% 100%}
.tw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tb{transform-origin:50% 42.857%;animation:spin 1.8s linear infinite;will-change:transform}
.cat.idle .tw{animation:bob 2.4s ease-in-out infinite}
.cat.think .tw{animation:tilt 2.2s ease-in-out infinite}
.cat.happy .tw{animation:hop .65s ease-out}
.cat.sad .tw{animation:slump .7s ease-out forwards}
button,.opt,.tile,.mbtn,.node{touch-action:manipulation}
body.busy .app,body.busy .app *{animation-play-state:paused!important}

@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes tilt{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes hop{30%{transform:translateY(-18px) rotate(-6deg)}60%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
@keyframes slump{to{transform:translateY(3px) scale(1.03,.95)}}
.bubble{position:relative;flex:1;min-width:0;background:#fff;color:var(--ink);font-weight:800;font-size:15px;line-height:1.35;padding:10px 14px;border-radius:16px 16px 16px 4px;margin-bottom:20px;border:2px solid var(--line)}

/* capa e extras do app da fábrica */
.bonus{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 12px;font-weight:900;color:var(--bad-d);animation:pop2 .45s cubic-bezier(.3,1.8,.5,1)}
.bonus svg{width:22px;height:22px;flex:none}
.newtag svg{width:18px;height:18px}
.pathcat{width:100px!important;height:112px!important}
@keyframes spin{to{transform:rotate(360deg)}}
.cover{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 6px}
.cover img{width:min(300px,80%);height:auto}
.cover span{font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px}
.bigword{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:900}
.opts.two{grid-template-columns:1fr 1fr}
.pron{font-size:15px;color:var(--blue-d);font-weight:900;margin-left:6px}
.tipm{margin-top:8px;background:#fff5d6;border-radius:10px;padding:8px 10px;color:#7a5600}
.inp{width:100%;font:inherit;font-size:18px;font-weight:800;padding:12px;border-radius:12px;border:2px solid var(--line);color:var(--ink);background:#fff}
.hint{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:min(92vw,420px);

@keyframes hin{from{opacity:0;transform:translate(-50%,10px)}}
.hint b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.hint .hp{font-size:18px;font-weight:900;color:var(--gold)}
.hint .ht{flex:1;min-width:0;font-size:15px;font-weight:800;color:#dfe6f7}
.hint button{color:#fff;font-weight:900;font-size:13px;text-decoration:underline;flex:none}
.nodewrap{z-index:1}.nodewrap.haspop{z-index:30}.nodewrap.catspot{z-index:0}
.icover{background:#fff;border-radius:22px;padding:16px 18px;width:100%;box-shadow:0 8px 0 rgba(0,40,100,.25);animation:drop2 .8s cubic-bezier(.3,1.5,.5,1) both}
.icover img{width:100%;height:auto;display:block}
@keyframes drop2{0%{transform:translateY(-60px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.ititle2{margin:0;font-family:var(--display);font-weight:400;color:#fff;font-size:clamp(40px,12vw,58px);line-height:.95;text-shadow:0 5px 0 rgba(0,40,100,.35);animation:fade .6s .5s both}
.ititle2 small{display:block;font-family:var(--body);font-weight:900;font-size:16px;letter-spacing:3px;text-transform:uppercase;margin-top:8px;color:#d6f0ff;text-shadow:none}
.icat{width:150px;height:168px}
.windline{position:absolute;height:3px;border-radius:3px;background:rgba(255,255,255,.55);animation:gust linear infinite}
@keyframes gust{from{transform:translateX(-30vw);opacity:0}20%{opacity:1}80%{opacity:1}to{transform:translateX(120vw);opacity:0}}

/* ===== Turbi (imagem) e cenário com vento ===== */
.cat{position:relative}
.tw{position:relative;width:100%;height:100%;transform-origin:50% 100%}
.timg{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 8px rgba(20,40,90,.22));-webkit-user-drag:none;user-select:none}
.cat.sad .timg{filter:saturate(.55) brightness(.96) drop-shadow(0 6px 8px rgba(20,40,90,.22))}
.cat .tear{position:absolute;left:60%;top:30%;width:8%;animation:tear 1.4s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(160%);opacity:0}}
.cat .qm{position:absolute;right:-4%;top:-4%;font-family:var(--display);font-size:clamp(20px,30%,44px);color:#2a62b0;background:#fff;border:3px solid #2a62b0;border-radius:50%;width:34%;aspect-ratio:1;display:grid;place-items:center;animation:float2 1.6s ease-in-out infinite}
@keyframes float2{50%{transform:translateY(-6px) rotate(8deg)}}
.cat .spark{position:absolute;inset:-6% -10%;pointer-events:none}
.cat .spark i{position:absolute;width:12%;aspect-ratio:1;background:#ffc93c;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twk .9s ease-out both}
@keyframes twk{0%{transform:scale(0) rotate(0)}60%{transform:scale(1.2) rotate(90deg)}100%{transform:scale(0) rotate(180deg)}}
.sayrow .cat{width:118px;height:138px}
.sayrow .say{margin-bottom:40px}
.done .bigcat{width:230px;height:268px}
.mcard .cat{width:150px;height:175px}
.ph .cat{width:120px;height:140px}
.pathcat{position:absolute;width:150px!important;height:175px!important}
/* turbinas de fundo */
.turb{position:absolute;bottom:0;aspect-ratio:1/2}
.turb svg{position:absolute;left:0;width:100%}
.turb .tt{top:0;height:100%}
.turb .tbl{top:5%;height:50%;animation:spin var(--sp,3s) linear infinite;will-change:transform}
/* folhas */
.leaves{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.leaf{position:absolute;left:0;top:var(--top);width:var(--sz);height:var(--sz);animation:leafx var(--dur) linear infinite;animation-delay:var(--dl);will-change:transform;opacity:.95}
.leaf svg{width:100%;height:100%;animation:flip 1.8s ease-in-out infinite alternate}
@keyframes leafx{0%{transform:translate(-60px,0) rotate(0)}25%{transform:translate(calc(var(--w) * .25),34px) rotate(140deg)}50%{transform:translate(calc(var(--w) * .5),-8px) rotate(270deg)}75%{transform:translate(calc(var(--w) * .75),40px) rotate(400deg)}100%{transform:translate(calc(var(--w) + 60px),18px) rotate(540deg)}}
@keyframes flip{0%{transform:scaleX(1)}100%{transform:scaleX(.35)}}
.gust{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:gust2 linear infinite}

.scene{position:relative;height:130px;border-radius:20px;overflow:hidden;background:linear-gradient(#bfe8ff,#e8f7ff 70%);--w:560px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.04)}

.cover{gap:10px}

.iwrap{z-index:2;gap:12px}
.ititle2{font-size:clamp(34px,10vw,50px)}
.icat-col{display:flex;flex-direction:column;align-items:center;gap:6px;animation:flyin 1s .8s cubic-bezier(.2,1.3,.5,1) both}
.icat{height:min(310px,37vh)!important;width:calc(min(310px,37vh) * .86)!important}
.ibub{margin:0!important;border-radius:16px!important;text-align:center;max-width:320px}
.icover{padding:12px 16px}

.intro{position:fixed;inset:0;z-index:70;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#3fb8ff 0,#1a6fd0 70%);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transition:opacity .5s,transform .5s}
.intro.out{opacity:0;transform:scale(1.15);pointer-events:none}
.iwrap{position:relative;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.ititle{margin:0;font-family:var(--display);font-weight:400;line-height:.9;display:flex;flex-direction:column;align-items:center}
.iline{font-size:clamp(54px,17vw,84px);letter-spacing:1px;display:flex}
.iline.big{font-size:clamp(64px,21vw,104px)}
.iline span{display:inline-block;color:var(--c);-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,40,100,.35);animation:drop .7s cubic-bezier(.3,1.7,.5,1) both,wig 2.6s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + 1s)}
.ismall{font-weight:900;font-size:20px;letter-spacing:4px;text-transform:uppercase;color:#fff;margin:6px 0;animation:fade .6s .7s both}
@keyframes drop{0%{transform:translateY(-140%) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes wig{0%,100%{transform:none}50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.icat-row{display:flex;align-items:flex-end;gap:10px;width:100%;animation:flyin 1s 1s cubic-bezier(.2,1.3,.5,1) both}
.icat{width:110px;height:110px}
.ibub{text-align:left;border:0}
@keyframes flyin{0%{transform:translateX(-120%) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.ichips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ichips span{background:#fff;color:var(--c);font-weight:900;font-size:14px;padding:6px 12px;border-radius:14px;box-shadow:0 3px 0 rgba(0,40,100,.25);animation:pop2 .5s cubic-bezier(.3,1.8,.5,1) both}
.ichips span:nth-child(1){animation-delay:1.6s}.ichips span:nth-child(2){animation-delay:1.75s}.ichips span:nth-child(3){animation-delay:1.9s}.ichips span:nth-child(4){animation-delay:2.05s}
@keyframes pop2{0%{transform:scale(0)}100%{transform:none}}
.ibtn{animation:fade .5s 2.2s both,pulse 1.6s 2.8s ease-in-out infinite;font-size:20px;padding:17px}
@keyframes pulse{50%{transform:scale(1.04)}}
.clouds i{position:absolute;background:rgba(255,255,255,.22);border-radius:60px;height:38px;animation:drift linear infinite}
.clouds i::before,.clouds i::after{content:"";position:absolute;background:inherit;border-radius:50%}
.clouds i::before{width:46px;height:46px;left:18px;top:-22px}.clouds i::after{width:34px;height:34px;left:52px;top:-14px}
.clouds i:nth-child(1){width:120px;top:9%;animation-duration:26s}
.clouds i:nth-child(2){width:90px;top:28%;animation-duration:34s;animation-delay:-12s}
.clouds i:nth-child(3){width:140px;top:62%;animation-duration:30s;animation-delay:-20s}
.clouds i:nth-child(4){width:100px;top:84%;animation-duration:38s;animation-delay:-6s}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const DICT={};
UNITS.forEach((u,k)=>{
  u.W=u.words.trim().split('\n').map(l=>{ const [en,pt,p]=l.split('|'); DICT[en.toLowerCase()]={t:pt,p,u:k,en}; return en; });
  u.S=u.sents.trim().split('\n').map(l=>{ const [en,pt]=l.split('|'); return {en,pt,u:k}; });
});
COMMON.trim().split('\n').forEach(l=>{ const [en,pt,p]=l.split('|'); const k=en.toLowerCase(); if(!DICT[k]) DICT[k]={t:pt,p,u:-1,en}; });
const clean=w=>String(w).toLowerCase().replace(/[?.!,]/g,'');
function lookup(raw){
  const w=clean(raw); if(DICT[w]) return w;
  if(w.endsWith('es')&&DICT[w.slice(0,-2)]) return w.slice(0,-2);
  if(w.endsWith('s')&&DICT[w.slice(0,-1)]) return w.slice(0,-1);
  return null;
}
const disp=k=>DICT[k].en==='i'?'I':DICT[k].en;
/* deixa cada palavra tocável; junta expressões de 2 ou 3 palavras quando existirem */
function wrapWords(text){
  const tk=text.split(' '), out=[];
  for(let i=0;i<tk.length;){
    let done=false;
    for(const n of [3,2]){
      if(i+n>tk.length) continue;
      const key=lookup(tk.slice(i,i+n).join(' '));
      if(key&&key.includes(' ')){ out.push(`<span class="w" data-w="${key}">${tk.slice(i,i+n).join(' ')}</span>`); i+=n; done=true; break; }
    }
    if(done) continue;
    const key=lookup(tk[i]);
    out.push(key?`<span class="w" data-w="${key}">${tk[i]}</span>`:tk[i]); i++;
  }
  return out.join(' ');
}

/* ---------- SOUND ---------- */
let ac=null,master=null,comp=null;
function A(force){
  if(!S.sound && !force) return null;
  try{
    if(!ac){
      try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
      ac=new (window.AudioContext||window.webkitAudioContext)();
      comp=ac.createDynamicsCompressor(); comp.connect(ac.destination);
      master=ac.createGain(); master.gain.value=.9; master.connect(comp);
      const dl=ac.createDelay(); dl.delayTime.value=.16; const fb=ac.createGain(); fb.gain.value=.25; const wet=ac.createGain(); wet.gain.value=.2;
      master.connect(dl); dl.connect(fb).connect(dl); dl.connect(wet).connect(comp);
    }
    if(ac.state==='suspended') ac.resume();
    return ac;
  }catch(e){ return null; }
}
function env(g,t,a,peak,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
function bell(f,dt=0,vol=.16){ try{ bell_(f,dt,vol); }catch(e){} }
function bell_(f,dt=0,vol=.16){ const c=A(); if(!c) return; const t=c.currentTime+dt;
  [[1,1],[2.01,.35],[3.98,.12]].forEach(([m,v])=>{ const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=f*m; env(g,t,.005,vol*v,.7); o.connect(g).connect(master); o.start(t); o.stop(t+.8); }); }
function blip(f1,f2,dur,type='sine',vol=.15,dt=0){ try{ blip_(f1,f2,dur,type,vol,dt); }catch(e){} }
function blip_(f1,f2,dur,type='sine',vol=.15,dt=0){ const c=A(); if(!c) return; const t=c.currentTime+dt;
  const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  env(g,t,.008,vol,dur); o.connect(g).connect(master); o.start(t); o.stop(t+dur+.05); }
function meow(happy=true,dt=0){ const c=A(); if(!c) return; const t=c.currentTime+dt, d=happy?.5:.8;
  const o=c.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(happy?540:440,t); o.frequency.linearRampToValueAtTime(happy?860:560,t+d*.35); o.frequency.linearRampToValueAtTime(happy?620:290,t+d);
  const lfo=c.createOscillator(),lg=c.createGain(); lfo.frequency.value=7; lg.gain.value=happy?8:16; lfo.connect(lg).connect(o.frequency);
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=4;
  bp.frequency.setValueAtTime(700,t); bp.frequency.linearRampToValueAtTime(1800,t+d*.35); bp.frequency.linearRampToValueAtTime(850,t+d);
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.4,t+.06); g.gain.setValueAtTime(.32,t+d*.6); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(bp).connect(g).connect(master); o.start(t); o.stop(t+d+.05); lfo.start(t); lfo.stop(t+d+.05); }

const midi=n=>440*Math.pow(2,(n-69)/12);
function note(f,t,d,type,vol,cut){ if(!(vol>0)) return; const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();
  o.type=type; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=cut||3600;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(d,.06));
  o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t+d+.08); }
function drum(k,t){
  if(k==='k'){ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(45,t+.16);
    g.gain.setValueAtTime(.55,t); g.gain.exponentialRampToValueAtTime(.0001,t+.2); o.connect(g).connect(master); o.start(t); o.stop(t+.22); return; }
  const src=ac.createBufferSource(); src.buffer=noiseBuf(ac); const f=ac.createBiquadFilter(), g=ac.createGain();
  const P={s:['bandpass',1900,.32,.14],h:['highpass',7500,.12,.04],c:['highpass',5000,.22,1.1],r:['highpass',3000,.1,.6]}[k];
  f.type=P[0]; f.frequency.value=P[1]; if(k==='r'){ f.frequency.setValueAtTime(1500,t); f.frequency.exponentialRampToValueAtTime(9000,t+.6); }
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(P[2],t+(k==='r'?.55:.004)); g.gain.exponentialRampToValueAtTime(.0001,t+P[3]+(k==='r'?.05:0));
  src.connect(f).connect(g).connect(master); src.start(t,Math.random()*.4); src.stop(t+P[3]+.1); }
/* seq: [nota(s) MIDI ou null, duração em batidas, bateria 'k s h c r'] */
function song(seq,bpm,shift=0,delay=0){ try{ const c=A(); if(!c) return; let t=c.currentTime+.03+delay; const b=60/bpm;
  seq.forEach(([n,len,dr])=>{ const d=len*b;
    if(n!=null)(Array.isArray(n)?n:[n]).forEach((m,i)=>{ const f=midi(m+shift);
      note(f,t,d*.92,'square',i?.03:.055,2800); note(f*2,t,Math.min(d,.3),'triangle',i?.02:.04,6000); note(f/2,t,d*.9,'triangle',i?0:.05,900); });
    if(dr) [...dr].forEach(k=>drum(k,t)); t+=d; }); }catch(e){} }

function shaper(){ if(SHAPER) return SHAPER; SHAPER=ac.createWaveShaper(); const n=1024,c=new Float32Array(n),k=40;
  for(let i=0;i<n;i++){ const x=i*2/n-1; c[i]=(1+k)*x/(1+k*Math.abs(x)); } SHAPER.curve=c; SHAPER.oversample='2x';
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; const g=ac.createGain(); g.gain.value=.5;
  SHAPER.connect(lp).connect(g).connect(MUS.bus); return SHAPER; }
function guitar(root,t,dur,v){ // power chord distorcido
  [0,7].forEach(i=>[4].forEach(dt=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type='sawtooth'; o.frequency.value=mf(root+i); o.detune.value=dt; mEnv(g,t,.004,v,dur); o.connect(g).connect(shaper()); o.start(t); o.stop(t+dur+.05); })); }
function synth(f,t,dur,v,type='sawtooth',cut=2000){ const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();
  o.type=type; o2.type=type; o.frequency.value=f; o2.frequency.value=f; o2.detune.value=12; lp.type='lowpass'; lp.frequency.value=cut;
  mEnv(g,t,.008,v,dur); o.connect(lp); o2.connect(lp); lp.connect(g).connect(MUS.bus); o.start(t); o2.start(t); o.stop(t+dur+.05); o2.stop(t+dur+.05); }
function makeHook(){ const pos=shuffle([0,2,3,6,8,10,11,14]).slice(0,6); const h=Array(16).fill(null); let idx=4+(Math.random()*3|0);
  pos.sort((a,b)=>a-b).forEach(p=>{ idx=Math.max(0,Math.min(9,idx+pick([-2,-1,1,2,0]))); h[p]=idx; }); return h; }
const mf=n=>440*Math.pow(2,(n-69)/12);
function noiseBuf(c){ if(MUS.noise) return MUS.noise; const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return MUS.noise=b; }
function mEnv(g,t,a,v,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(v,.0002),t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
function keys(f,t,dur,v,soft){ const c=ac; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=soft?1200:2200; lp.connect(MUS.bus);
  [['sine',1,1],['triangle',2,.25]].forEach(([ty,m,vv])=>{ const o=c.createOscillator(),g=c.createGain(); o.type=ty; o.frequency.value=f*m; o.detune.value=(Math.random()-.5)*8; mEnv(g,t,soft?.08:.01,v*vv,dur); o.connect(g).connect(lp); o.start(t); o.stop(t+dur+.2); }); }
function bass(f,t,dur,v){ const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter(); o.type='triangle'; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=500; mEnv(g,t,.01,v,dur); o.connect(lp).connect(g).connect(MUS.bus); o.start(t); o.stop(t+dur+.1); }
function kick(t,v){ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(42,t+.25); mEnv(g,t,.005,v,.3); o.connect(g).connect(MUS.bus); o.start(t); o.stop(t+.35); }
function hiss(t,dur,v,type,freq,q=1){ const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(); s.buffer=noiseBuf(ac); f.type=type; f.frequency.value=freq; f.Q.value=q; mEnv(g,t,.002,v,dur); s.connect(f).connect(g).connect(MUS.bus); s.start(t,Math.random()*.5); s.stop(t+dur+.05); }
function chordNotes(deg,q){ let base=48+((MUS.key+deg)%12); if(base<50) base+=12; return CH[q].map(i=>base+i); }
function playStep(s,t){
  const st=MUS.style, sd=60/MUS.bpm/4, prog=MUS.prog, [deg,q]=prog[MUS.bar%prog.length];
  const notes=chordNotes(deg,q), root=36+((MUS.key+deg)%12), penta=[0,2,4,7,9].map(i=>72+((MUS.key+i)%12));
  if(st==='lofi'){
    if(s%4===2) t+=sd*.14; // swing
    if(s===0) notes.forEach(n=>keys(mf(n),t,sd*15,.045,true));
    if(s===10 && Math.random()<.5) notes.slice(1).forEach(n=>keys(mf(n),t,sd*5,.03,true));
    if(s===0) bass(mf(root),t,sd*6,.22); if(s===10) bass(mf(root+(Math.random()<.5?7:0)),t,sd*5,.18);
    if(s===0||s===10||(s===7&&Math.random()<.4)) kick(t,.42);
    if(s===4||s===12) hiss(t,.16,.13,'bandpass',1500,.8);
    if(s%2===0) hiss(t,.04,s%4===0?.05:.03,'highpass',7000);
    if(Math.random()<.06) hiss(t,.01,.02,'highpass',3000); // chiado de vinil
    if(s%2===0 && Math.random()<.18) keys(mf(pick(penta)),t,sd*3,.035,false);
  } else if(st==='poprock' || st==='dance'){
    const chorus=Math.floor(MUS.bar/4)%2===1;          // 4 compassos de verso, 4 de refrão
    const scale=[0,2,4,7,9]; const hookNote=i=>67+((MUS.key)%12)+[0,2,4,7,9,12,14,16,19,21][i];
    const gRoot=40+((MUS.key+deg)%12);
    if(st==='poprock'){
      if(s===0||s===8||(s===10&&chorus)||(s===6&&Math.random()<.3)) kick(t,.55);
      if(s===4||s===12){ hiss(t,.18,.26,'bandpass',1800,.7); hiss(t,.08,.1,'highpass',4000); }
      if(s%2===0) hiss(t,.035,s%4===0?.06:.035,'highpass',8000);
      if(s===0 && MUS.bar%4===0 && chorus) hiss(t,1.2,.12,'highpass',5000);
      if(s%2===0) bass(mf(root),t,sd*1.6,.26);
      if(chorus){ if(s===0||s===6||s===10) guitar(gRoot,t,sd*(s===0?6:4),.05); }
      else if(s%2===0) guitar(gRoot,t,sd*.9,.035);       // palhetada abafada
      if(chorus && MUS.hook[s]!=null) synth(mf(hookNote(MUS.hook[s])),t,sd*1.8,.05,'square',2600);
    } else {
      if(s%4===0) kick(t,.6);
      if(s===4||s===12) hiss(t,.12,.22,'bandpass',1400,.9);
      if(s%4===2) hiss(t,.12,.07,'highpass',7000);
      else hiss(t,.03,.03,'highpass',9000);
      synth(mf(root+(s%2?12:0)),t,sd*.8,.07,'sawtooth',chorus?900:600);
      if(s%4===2) notes.forEach(n=>synth(mf(n+12),t,sd*1.4,.022,'sawtooth',chorus?3200:2000));
      if(chorus && MUS.hook[s]!=null) synth(mf(hookNote(MUS.hook[s])),t,sd*1.6,.05,'square',3000);
      if(!chorus && s===0 && MUS.bar%4===3) [0,2,4,6,8,10,12,14].forEach((x,i)=>hiss(t+x*sd,.05,.03+i*.01,'bandpass',1500+i*500,2));
    }
  } else {
    if(s===0){ notes.forEach(n=>keys(mf(n),t,sd*16,.025,true)); bass(mf(root+12),t,sd*15,.12); }
    const arp=[0,1,2,3,2,1,2,3];
    if(s%2===0) keys(mf(notes[arp[s/2]]+12),t,sd*4,.05,true);
    if(s%4===0 && Math.random()<.2) keys(mf(pick(penta)+12),t,sd*6,.03,true);
  }
}
function newSong(){
  const st=STYLES[MUS.style];
  MUS.key=Math.random()*12|0; MUS.prog=pick(st.progs);
  MUS.bpm=st.bpm[0]+(Math.random()*(st.bpm[1]-st.bpm[0])|0);
  MUS.bar=0; MUS.step=0; MUS.hook=makeHook();
  MUS.label=`${st.name} em ${KEYS[MUS.key]} · ${MUS.bpm} bpm`;
  renderRadio();
}
function tick(){
  if(!MUS.on||!ac) return;
  while(MUS.next < ac.currentTime+.15){
    playStep(MUS.step,MUS.next);
    MUS.next+=60/MUS.bpm/4; MUS.step++;
    if(MUS.step>=16){ MUS.step=0; MUS.bar++; if(MUS.bar>=Math.max(16,MUS.prog.length*4)) newSong(); }
  }
}
/* No iPhone, o modo silencioso cala o som do site. Tocar um áudio mudo em loop
   faz o celular tratar o app como "tocador de música", e aí a rádio toca. */
let unlockEl=null;
function silentWav(){ const n=8000,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,s)=>[...s].forEach((c,i)=>b[o+i]=c.charCodeAt(0));
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  b.fill(128,44); let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return 'data:audio/wav;base64,'+btoa(s); }
function unlockAudio(){
  try{ if(!unlockEl){ unlockEl=document.createElement('audio'); unlockEl.src=silentWav(); unlockEl.loop=true; unlockEl.setAttribute('playsinline',''); unlockEl.volume=.01; }
    const p=unlockEl.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  if(ac && ac.state!=='running') ac.resume();
}
document.addEventListener('pointerdown',()=>{ if(MUS.on) unlockAudio(); else if(ac && ac.state==='suspended') ac.resume(); });
const MUSIC_GAIN=1.8;
function musicOn(){
  unlockAudio();
  const c=A(true); if(!c) return;
  unlockAudio();
  if(!MUS.bus){ MUS.bus=c.createGain(); MUS.bus.connect(comp); }
  MUS.bus.gain.setValueAtTime(.0001,c.currentTime); MUS.bus.gain.exponentialRampToValueAtTime(Math.max(S.music.vol*MUSIC_GAIN,.001),c.currentTime+1.2);
  MUS.style=S.music.style; MUS.on=true; newSong(); MUS.next=c.currentTime+.1;
  clearInterval(MUS.timer); MUS.timer=setInterval(tick,25);
  S.music.on=true; save(); renderRadio();
}
function musicOff(){
  MUS.on=false; clearInterval(MUS.timer);
  if(MUS.bus&&ac) MUS.bus.gain.setTargetAtTime(.0001,ac.currentTime,.2);
  try{ unlockEl && unlockEl.pause(); }catch(e){}
  S.music.on=false; save(); renderRadio();
}
function duck(){ if(!MUS.on||!MUS.bus) return; const t=ac.currentTime; MUS.bus.gain.cancelScheduledValues(t); MUS.bus.gain.setTargetAtTime(Math.max(S.music.vol*MUSIC_GAIN*.2,.001),t,.05); MUS.bus.gain.setTargetAtTime(Math.max(S.music.vol*MUSIC_GAIN,.001),t+2,.4); }
function renderRadio(){
  const on=MUS.on;
  if($('musBtn')){ $('musBtn').textContent=on?'Desligar':'Ligar'; $('musBtn').setAttribute('aria-pressed',on); }
  if($('musNow')) $('musNow').innerHTML=on?`<span class="eq"><i></i><i></i><i></i></span>${MUS.label}`:'Desligada · música instrumental feita na hora';
  if($('musStyles')) $('musStyles').innerHTML=Object.entries(STYLES).map(([k,v])=>`<button class="scene" aria-pressed="${S.music.style===k}" data-ms="${k}">${v.name}</button>`).join('');
  if($('musQuick')) $('musQuick').classList.toggle('on',on);
}

const TEAR='<svg class="tear" viewBox="0 0 10 14"><path d="M5 0C5 0 0 7 0 9.5A5 5 0 0 0 10 9.5C10 7 5 0 5 0Z" fill="#5cc8ff"/></svg>';
function catSVG(mood){
  const extra=mood==='sad'?TEAR:mood==='think'?'<span class="qm">?</span>':mood==='happy'?'<span class="spark"><i style="left:4%;top:20%"></i><i style="right:2%;top:8%;animation-delay:.15s"></i><i style="right:10%;top:55%;animation-delay:.3s"></i></span>':'';
  return `<div class="tw" aria-hidden="true"><img class="timg" src="${TURBI}" alt="" draggable="false">${extra}</div>`;
}
function setCat(el,mood){ if(!el) return; el.classList.remove('idle','happy','sad','think'); el.classList.add('cat',mood); el.innerHTML=catSVG(mood); }

/* voz do Turbi: um "vuuush" de vento + um piado */
function meow(happy=true,dt=0){ try{ meow_(happy,dt); }catch(e){} }
function meow_(happy=true,dt=0){
  const c=A(); if(!c) return; const t=c.currentTime+dt;
  try{
    const s=c.createBufferSource(); s.buffer=noiseBuf(c);
    const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.4;
    f.frequency.setValueAtTime(happy?350:1200,t); f.frequency.exponentialRampToValueAtTime(happy?2600:260,t+.55);
    const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.5,t+.16); g.gain.exponentialRampToValueAtTime(.0001,t+.65);
    s.connect(f).connect(g).connect(master); s.start(t,Math.random()*.3); s.stop(t+.7);
  }catch(e){}
  if(happy){ blip(700,1400,.16,'sine',.11,dt+.12); blip(1050,1900,.13,'sine',.09,dt+.3); }
  else blip(520,240,.4,'sine',.12,dt+.12);
}
const whoosh=(dt=0)=>{ try{ whoosh_(dt); }catch(e){} };
const whoosh_=(dt=0)=>{ const c=A(); if(!c) return; const t=c.currentTime+dt; const s=c.createBufferSource(); s.buffer=noiseBuf(c);
  const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=.8; f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(3200,t+.35);
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.28,t+.08); g.gain.exponentialRampToValueAtTime(.0001,t+.4);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+.45); };

/* ================= FALA, DICA E CARTÃO DA PALAVRA ================= */
const canSpeak='speechSynthesis' in window;
let VOICE=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices(); VOICE=v.find(x=>x.lang==='en-US'&&/Samantha|Google US|Aria|Jenny|Ava/.test(x.name))||v.find(x=>x.lang==='en-US')||v.find(x=>/^en/.test(x.lang))||null; }catch(e){} }
if(canSpeak){ pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
let speakT=null;
function speakRate(t,r){ duck(); clearTimeout(speakT);
  speakT=setTimeout(()=>{ try{ const ss=speechSynthesis; if(ss.speaking||ss.pending) ss.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=r; if(VOICE) u.voice=VOICE; ss.speak(u);}catch(e){} },40); }
const speak=t=>speakRate(t,.88);
const SPK='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
function remember(k){ S.cards=S.cards||{}; if(!S.cards[k]){ S.cards[k]={box:0,due:Date.now()}; save(); return true; } return false; }
function exampleFor(k){
  const re=new RegExp('(^|[^a-z])'+k.replace(/[-]/g,'\\-')+'(s|es)?([^a-z]|$)','i');
  for(const u of UNITS) for(const s of u.S) if(re.test(s.en)) return s;
  return null;
}
function memBlock(k){
  const ex=exampleFor(k);
  return `<div class="mem"><span class="lbl">Para não esquecer</span>${MEM[k]||'Fale a palavra em voz alta três vezes e imagine a cena na fábrica.'}
    ${ex?`<div class="ex">"${ex.en}"<small>${ex.pt}</small></div>`:''}</div>`;
}
function openWord(k){
  const d=DICT[k]; if(!d) return;
  sTap(); const isNew=remember(k), word=disp(k);
  const th=/th/.test(k)?`<div class="wtip">Som de <b>th</b>: encoste a ponta da língua nos dentes de cima e solte o ar.</div>`:'';
  $('wpopIn').innerHTML=`<div class="wtop"><span class="wword">${word}</span>${canSpeak?`<button class="spk" id="wspk" aria-label="Ouvir">${SPK}</button>`:''}<button class="wx" id="wx" aria-label="Fechar">×</button></div>
    <div class="wrow"><span class="lbl">Pronúncia</span><span class="wpron">${d.p}</span></div>
    <div class="wrow"><span class="lbl">Tradução</span><span class="wtr">${d.t}</span></div>${th}${memBlock(k)}
    <div class="wnote">A parte em MAIÚSCULA é a sílaba mais forte. <b class="saved">${isNew?'Guardada na sua caderneta.':'Já está na sua caderneta.'}</b></div>`;
  $('wpop').hidden=false;
  if(canSpeak){ speak(word); $('wspk').onclick=()=>speak(word); }
  $('wx').onclick=()=>$('wpop').hidden=true;
}
document.addEventListener('click',e=>{
  const w=e.target.closest('.w'); if(w){ e.stopPropagation(); openWord(w.dataset.w); return; }
  if(!$('wpop').hidden && !e.target.closest('.wcard')) $('wpop').hidden=true;
},true);
document.addEventListener('click',e=>{ const c=e.target.closest('.cat'); if(!c||c.closest('.intro')&&false) return; meow(true); const m=c.classList.contains('sad')?'sad':'idle'; setCat(c,'happy'); setTimeout(()=>setCat(c,m),800); });
let hintT=null;
function hint(raw,noT=false){
  const k=lookup(raw); if(!k) return;
  remember(k);
  const d=DICT[k], word=disp(k);
  $('hint').innerHTML=`<div><b>${word}</b><div class="hp">${d.p}</div></div><span class="ht">${noT?'Pronúncia. A tradução aparece na resposta.':d.t}</span>${noT?'':'<button id="hintMore">mais</button>'}`;
  $('hint').hidden=false;
  if(!noT) $('hintMore').onclick=e=>{ e.stopPropagation(); $('hint').hidden=true; openWord(k); };
  if(canSpeak) speak(word);
  clearTimeout(hintT); hintT=setTimeout(()=>$('hint').hidden=true,3500);
}

const MAXH=5, HEART_MIN=10, ZERO_MIN=10, GOAL=30;
const HEARTI='<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#ff5a5f" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>';
const NODES=[{type:'lesson',n:1},{type:'lesson',n:2},{type:'chest'},{type:'lesson',n:3},{type:'lesson',n:4},{type:'trophy'}];
const OFF=[0,52,76,52,0,-52];
const KINDS=['pickPt','pickPt','match','pickEn','build','listenWord','pickPt','listenBuild','build'];
const KTROPHY=['match','pickEn','build','listenWord','build','pickPt','listenBuild','build','pickEn','listenPick'];
const prog=s=>S.prog[s]||0;
const unitOpen=k=>k===0||prog(UNITS[k-1].s)>=NODES.length;
const today=()=>new Date().toDateString();
function streakNow(){ const y=new Date(Date.now()-864e5).toDateString(); return (S.last===today()||S.last===y)?S.streak:0; }
function group(u,n){ const q=Math.ceil(u.W.length/4); return u.W.slice((n-1)*q,n*q); }

function refillHearts(){
  const now=Date.now();
  if(S.hearts<=0){
    if(!S.zeroAt) S.zeroAt=now;
    if(now-S.zeroAt>=ZERO_MIN*60000){ S.hearts=MAXH; S.zeroAt=null; S.heartAt=now; save(); }
    return;
  }
  S.zeroAt=null;
  if(S.hearts>=MAXH){ S.heartAt=now; return; }
  const n=Math.floor((now-S.heartAt)/(HEART_MIN*60000));
  if(n>0){ S.hearts=Math.min(MAXH,S.hearts+n); S.heartAt+=n*HEART_MIN*60000; if(S.hearts>=MAXH) S.heartAt=now; save(); }
}
function renderTop(){
  $('tStreak').textContent=streakNow(); $('tStreak').parentNode.classList.toggle('off',S.last!==today());
  $('tGems').textContent=S.gems; $('tHearts').textContent=S.hearts;
}
setInterval(()=>{ refillHearts(); renderTop(); },60000);

let curTab='path', openNode=null;

function nodeLabel(n){ return n.type==='chest'?'Baú de prêmios':n.type==='trophy'?'Desafio final':'Lição '+n.n; }
function nodeState(k,i){ const p=prog(UNITS[k].s); return !unitOpen(k)?'locked':i<p?'done':i===p?'current':'locked'; }
function popover(u,n,i,st){
  if(n.type==='chest') return `<div class="popover locked"><b>${st==='done'?'Baú aberto':'Baú de prêmios'}</b><span>${st==='done'?'Você já pegou as gemas deste baú.':'Termine as lições antes dele para abrir.'}</span></div>`;
  if(st==='locked') return `<div class="popover locked"><b>${nodeLabel(n)}</b><span>Complete as fases anteriores para desbloquear.</span></div>`;
  const title=n.type==='trophy'?`Desafio final: ${u.name}`:`Lição ${n.n} de 4`;
  const sub=n.type==='trophy'?'10 exercícios com tudo da unidade':group(u,n.n).slice(0,4).map(w=>DICT[w.toLowerCase()].en).join(', ')+'...';
  return `<div class="popover"><b>${title}</b><span>${sub}</span><button class="btn" data-start="${u.s}|${i}">${st==='done'?'Praticar de novo +5 XP':'Começar +'+(n.type==='trophy'?30:15)+' XP'}</button></div>`;
}
function renderPath(){
  let h='';
  UNITS.forEach((u,k)=>{
    const open=unitOpen(k), p=prog(u.s);
    h+=`<div class="unit" style="--uc:${u.c};--ud:${u.d}">
      <div class="ubanner ${open?'':'locked'}"><div class="ut"><small>Unidade ${k+1} · ${u.W.length} palavras</small><b>${u.name}</b><span>${open?u.desc:'Termine a unidade anterior'}</span></div><span class="ucount">${p}/6</span></div><div class="nodes">`;
    NODES.forEach((n,i)=>{
      const st=nodeState(k,i), id=u.s+'|'+i;
      let cls='node', inner;
      if(n.type==='chest'){ cls+=' chest'; inner=chestSVG(st==='done',st==='locked'); }
      else if(n.type==='trophy'){ cls+=' trophy'; inner=trophySVG(st); }
      else { if(st!=='current') cls+=' '+st; inner=st==='done'?ICON.check:ICON.star; }
      h+=`<div class="nodewrap ${st}${openNode===id?' haspop':''}${i===2?' catspot':''}" style="transform:translateX(${OFF[i]}px);--o:${OFF[i]}px">
        ${st==='current'&&openNode!==id?`<span class="start-tag">${p===0?'COMEÇAR':n.type==='chest'?'ABRIR':'CONTINUAR'}</span>`:''}
        <button class="${cls}" data-node="${id}" aria-label="${nodeLabel(n)}">${inner}</button>
        ${i===2&&k%2===0?`<div class="cat idle pathcat" style="left:-188px;top:-60px;pointer-events:none"></div>`:''}
        ${openNode===id?popover(u,n,i,st):''}</div>`;
    });
    h+=`</div></div>`;
  });
  $('tab-path').innerHTML=h;
  $('tab-path').querySelectorAll('.pathcat').forEach(el=>el.innerHTML=catSVG('idle'));
}
$('tab-path').onclick=e=>{
  const sb=e.target.closest('[data-start]');
  if(sb){ const [s,i]=sb.dataset.start.split('|'); openNode=null; renderPath(); startLesson(s,+i); return; }
  const b=e.target.closest('[data-node]');
  if(!b){ if(openNode&&!e.target.closest('.popover')){ openNode=null; renderPath(); } return; }
  const [s,is]=b.dataset.node.split('|'), i=+is, k=UNITS.findIndex(u=>u.s===s);
  sTap();
  if(NODES[i].type==='chest' && nodeState(k,i)==='current'){ openChest(s,i); return; }
  openNode=openNode===b.dataset.node?null:b.dataset.node; renderPath();
};

/* ================= LIÇÃO ================= */
let L=null;
function buildExercises(k,node){
  const u=UNITS[k];
  const focus=node.type==='trophy'?u.W.slice():group(u,node.n);
  const review=node.type==='trophy'?u.W.slice():u.W.slice(0,Math.ceil(u.W.length/4)*node.n);
  const wrongFirst=a=>shuffle(a).sort((x,y)=>(S.wrong.includes(y)?1:0)-(S.wrong.includes(x)?1:0));
  let fq=wrongFirst(focus), fi=0;
  const nextWord=()=>fq[fi++%fq.length];
  const others=(w,pool,n,f)=>{ const out=[], seen=new Set([f(w)]); for(const x of shuffle(pool.length>n+2?pool:u.W)) { if(x!==w&&!seen.has(f(x))){ seen.add(f(x)); out.push(x); if(out.length===n) break; } } return out; };
  const sq=wrongFirst(u.S.map(s=>s.en)).map(en=>u.S.find(s=>s.en===en));
  const fl=focus.map(w=>w.toLowerCase());
  const sentFirst=sq.filter(s=>fl.some(w=>s.en.toLowerCase().includes(w))).concat(sq);
  let si=0; const nextSent=()=>sentFirst[si++%sentFirst.length];
  const tr=w=>DICT[w.toLowerCase()].t;
  let kinds=node.type==='trophy'?KTROPHY:KINDS;
  return kinds.map(kd=>{
    if(!canSpeak&&kd.startsWith('listen')) kd=kd==='listenWord'?'pickEn':'build';
    if(kd==='match'){ const seen=new Set(), pairs=[]; for(const w of shuffle(review)){ const t=tr(w).split(/[(/]/)[0].trim(); if(seen.has(t)) continue; seen.add(t); pairs.push([w.toLowerCase(),t]); if(pairs.length===5) break; } return {kind:'match',pairs}; }
    if(kd==='pickPt'||kd==='pickEn'||kd==='listenWord'){ const w=nextWord(); return {kind:kd,w:w.toLowerCase(),opts:shuffle([w,...others(w,review,kd==='listenWord'?3:2,tr)]).map(x=>x.toLowerCase())}; }
    if(kd==='listenPick'){ const s=nextSent(); const o=shuffle(u.S.filter(x=>x!==s)).slice(0,2); return {kind:kd,s,opts:shuffle([s.pt,...o.map(x=>x.pt)])}; }
    return {kind:kd,s:nextSent()};
  });
}
function startLesson(s,i){
  refillHearts();
  if(S.hearts<=0) return noHearts(false);
  const k=UNITS.findIndex(u=>u.s===s);
  L={s,k,i,node:NODES[i],ex:buildExercises(k,NODES[i]),q:0,ok:0,tries:0,combo:0,best:0,t0:Date.now(),miss:[]};
  $('lesson').hidden=false; document.body.style.overflow='hidden';document.body.classList.add('busy'); whoosh();
  renderEx();
}
function footCheck(){ $('lfoot').className='lfoot'; $('lfootIn').innerHTML='<button class="btn" id="lcheck" disabled>Verificar</button>'; $('lcheck').onclick=check; }
function listenBtns(){ return `<div class="listen"><button class="bigspk" id="say1" aria-label="Ouvir">${SPK}</button><button class="slow" id="say2">Devagar</button></div>`; }
function renderEx(){
  const ex=L.ex[L.q]; L.sel=null; L.locked=false;
  L.target=ex.s?ex.s.en:ex.w?disp(ex.w):'';
  $('lprog').style.width=(L.q/L.ex.length*100)+'%'; $('lHearts').textContent=S.hearts;
  let h=L.combo>=3?`<div class="streakmsg">${L.combo} seguidas!</div>`:'';
  if(ex.kind==='pickPt'){
    const isNew=!S.seen[ex.w];
    h+=`${isNew?`<div class="newtag">${ICON.star} Nova palavra</div>`:''}<h2 class="ltitle">O que significa?</h2>
      <div class="sayrow"><div class="cat idle" id="exCat"></div><div class="say bigword"><button class="spk" id="say1" aria-label="Ouvir">${SPK}</button><span class="w" data-w="${ex.w}">${disp(ex.w)}</span></div></div>
      <div class="opts">${ex.opts.map(o=>`<button class="opt" data-o="${o}">${DICT[o].t}</button>`).join('')}</div>`;
  } else if(ex.kind==='pickEn'){
    h+=`<h2 class="ltitle">Como se diz em inglês?</h2>
      <div class="sayrow"><div class="cat idle" id="exCat"></div><div class="say bigword">"${DICT[ex.w].t}"</div></div>
      <div class="opts">${ex.opts.map(o=>`<button class="opt" data-o="${o}">${disp(o)}</button>`).join('')}</div>`;
  } else if(ex.kind==='listenWord'){
    h+=`<h2 class="ltitle">Qual palavra você ouviu?</h2>${listenBtns()}
      <div class="opts two">${ex.opts.map(o=>`<button class="opt" data-o="${o}">${disp(o)}</button>`).join('')}</div>`;
  } else if(ex.kind==='build'||ex.kind==='listenBuild'){
    const t=ex.s.en, end=/[?.!]$/.test(t)?t.slice(-1):'', words=(end?t.slice(0,-1):t).split(' '), low=words.map(w=>clean(w));
    let tiles=words.map((w,i)=>i===0&&w!=='I'&&!/^[A-Z]{2,}$/.test(w)?w.toLowerCase():w);
    const pool=shuffle(UNITS[L.k].W.filter(w=>!w.includes(' ')&&!low.includes(w.toLowerCase())));
    tiles=tiles.concat(pool.slice(0,words.length>6?2:1));
    L.tiles=shuffle(tiles).map((w,i)=>({id:i,w})); L.placed=[]; L.words=words; L.end=end;
    h+=ex.kind==='build'
      ? `<h2 class="ltitle">Escreva isto em inglês</h2><div class="sayrow"><div class="cat idle" id="exCat"></div><div class="say">${ex.s.pt}</div></div>`
      : `<h2 class="ltitle">Toque no que você ouvir</h2>${listenBtns()}`;
    h+=`<div class="lines" id="zone"></div><div class="bank" id="bank"></div>`;
  } else if(ex.kind==='listenPick'){
    h+=`<h2 class="ltitle">O que você ouviu?</h2>${listenBtns()}
      <div class="opts">${ex.opts.map(o=>`<button class="opt wide" data-o="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div>`;
  } else {
    L.m={en:null,pt:null,done:0,err:0};
    h+=`<h2 class="ltitle">Toque nos pares</h2><div class="match">
      <div class="col">${shuffle(ex.pairs).map(([w])=>`<button class="mbtn" data-side="en" data-k="${w}">${disp(w)}</button>`).join('')}</div>
      <div class="col">${shuffle(ex.pairs).map(([w,t])=>`<button class="mbtn" data-side="pt" data-k="${w}">${t}</button>`).join('')}</div></div>`;
  }
  $('lbody').innerHTML=h; $('lbody').scrollTop=0;
  setCat($('exCat'),'idle'); footCheck();
  if(ex.kind==='build'||ex.kind==='listenBuild') drawTiles();
  if(ex.kind.startsWith('listen')||ex.kind==='pickPt') setTimeout(()=>speakRate(L.target,.9),350);
  if(ex.w) S.seen[ex.w]=1;
}
function drawTiles(){
  $('zone').innerHTML=L.placed.map(id=>`<button class="tile" data-id="${id}">${L.tiles[id].w}</button>`).join('');
  $('bank').innerHTML=L.tiles.map(t=>`<button class="tile ${L.placed.includes(t.id)?'ghost':''}" data-id="${t.id}">${t.w}</button>`).join('');
  $('lcheck').disabled=!L.placed.length;
}
$('lbody').onclick=e=>{
  if(!L||L.locked) return;
  const ex=L.ex[L.q];
  if(e.target.closest('#say1')) return speakRate(L.target,.9);
  if(e.target.closest('#say2')) return speakRate(L.target,.5);
  const o=e.target.closest('.opt');
  if(o){ $('lbody').querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===o)); L.sel=o.dataset.o; sTap();
    if(ex.kind==='pickEn'||ex.kind==='listenWord') hint(L.sel,true);
    $('lcheck').disabled=false; return; }
  const t=e.target.closest('.tile');
  if(t){ const id=+t.dataset.id;
    if(t.closest('#bank')){ if(!L.placed.includes(id)){ L.placed.push(id); blip(700,1000,.06,'sine',.1); hint(L.tiles[id].w); } }
    else { L.placed.splice(L.placed.indexOf(id),1); blip(600,400,.06,'sine',.1); }
    drawTiles(); return; }
  const m=e.target.closest('.mbtn'); if(m) matchTap(m);
};
function matchTap(m){
  const M=L.m, side=m.dataset.side;
  if(m.classList.contains('gone')) return;
  if(side==='en') hint(m.dataset.k,true); else sTap();
  M[side]=m; m.parentNode.querySelectorAll('.mbtn').forEach(x=>x.setAttribute('aria-pressed',x===m));
  if(!(M.en&&M.pt)) return;
  const a=M.en,b=M.pt; M.en=M.pt=null; a.setAttribute('aria-pressed','false'); b.setAttribute('aria-pressed','false');
  if(a.dataset.k===b.dataset.k){
    a.classList.add('okk'); b.classList.add('okk'); blip(880,1320,.1,'triangle',.1); remember(a.dataset.k);
    setTimeout(()=>{ a.classList.replace('okk','gone'); b.classList.replace('okk','gone'); },350);
    if(++M.done===L.ex[L.q].pairs.length) setTimeout(()=>result(true,{}),550);
  } else {
    a.classList.add('nok'); b.classList.add('nok'); M.err++; blip(300,200,.15,'triangle',.12);
    setTimeout(()=>{ a.classList.remove('nok'); b.classList.remove('nok'); },500);
  }
}
function check(){
  $('hint').hidden=true;
  const ex=L.ex[L.q]; L.locked=true;
  if(ex.kind==='build'||ex.kind==='listenBuild'){
    const mine=L.placed.map(id=>L.tiles[id].w);
    return result(mine.map(clean).join(' ')===L.words.map(clean).join(' '),{placed:mine,end:L.end});
  }
  const right=ex.kind==='listenPick'?ex.s.pt:ex.w, ok=L.sel===right;
  $('lbody').querySelectorAll('.opt').forEach(x=>{ if(x.dataset.o===right) x.classList.add('okk'); else if(x.dataset.o===L.sel) x.classList.add('nok'); });
  result(ok,{chosen:L.sel});
}
function wInfo(k){ return `<b>${disp(k)}</b> (${DICT[k].p}) = "${DICT[k].t}"`; }
function explain(ex,info){
  if(ex.kind==='pickPt') return `Você escolheu "${DICT[info.chosen].t}", que em inglês é ${wInfo(info.chosen)}. A palavra da pergunta era ${wInfo(ex.w)}.${MEM[ex.w]?`<div class="tipm">${MEM[ex.w]}</div>`:''}`;
  if(ex.kind==='pickEn') return `Você escolheu ${wInfo(info.chosen)}. "${DICT[ex.w].t}" em inglês é ${wInfo(ex.w)}.${MEM[ex.w]?`<div class="tipm">${MEM[ex.w]}</div>`:''}`;
  if(ex.kind==='listenWord') return `O áudio dizia ${wInfo(ex.w)}. Você escolheu ${wInfo(info.chosen)}. Toque no alto-falante e compare o som das duas.`;
  if(ex.kind==='listenPick') return `A frase falada foi <b>${ex.s.en}</b>. Toque em <b>Devagar</b> para ouvir palavra por palavra.`;
  const want=L.words.map(clean), got=info.placed.map(clean);
  const extra=got.filter(x=>!want.includes(x)), missing=want.filter(x=>!got.includes(x)), parts=[];
  if(extra.length){ const k=lookup(extra[0]); parts.push(`Você usou <b>${extra[0]}</b>${k?` ("${DICT[k].t}")`:''}, que não entra nesta frase.`); }
  if(missing.length) parts.push(`Faltou: <b>${missing.join(', ')}</b>.`);
  if(!extra.length&&!missing.length){
    let i=0; while(i<want.length&&got[i]===want[i]) i++;

function result(ok,info){

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('confetti'), x=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#2a62b0','#2fb4ff','#ffc93c','#14b8a6','#ff8a3d','#ffffff'];
  const P=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,c:cols[Math.random()*6|0],a:Math.random()*6}));
  let f=0;(function loop(){ x.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1; x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-4,-2,8+p.r,5);x.restore();});
    if(++f<180) requestAnimationFrame(loop); else x.clearRect(0,0,cv.width,cv.height); })();
}
